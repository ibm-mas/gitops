name: Update Internal GHE Mirror

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  schedule:
    # Daily reconciliation at 02:00 UTC to prune deleted branches/tags
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ghe-mirror-sync
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to Internal GHE
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repository
        env:
          SOURCE_REPO: ${{ github.repository }}
          TARGET_REPO: automation-paas-cd-pipeline/mas-gitops
          PUBLIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHE_TOKEN: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
        run: |
          set -e

          echo "Cloning source repository (bare)..."
          git clone --bare "https://x-access-token:${PUBLIC_TOKEN}@github.com/${SOURCE_REPO}.git" repo.git
          cd repo.git

          echo "Pushing mirror refs to https://github.ibm.com/${TARGET_REPO}..."
          # Explicitly push heads and tags; avoid pushing internal GitHub pull-request refs (refs/pull/*)
          git push --prune --force "https://x-access-token:${GHE_TOKEN}@github.ibm.com/${TARGET_REPO}.git" "refs/heads/*:refs/heads/*" "refs/tags/*:refs/tags/*"

          echo "Mirror sync completed successfully."
