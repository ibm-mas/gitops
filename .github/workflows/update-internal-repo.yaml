name: Update Internal GHE Mirror

on:
  # Automated push/schedule triggers disabled on public GitHub Actions runners due to github.ibm.com network isolation.
  # Use internal pull-model sync (e.g. OpenShift CronJob / pipeline) within the IBM intranet.
  # Manual dispatch retained for on-demand execution and test verification.
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository on GHE'
        required: true
        default: 'Devansh-Raghuvanshi/mas-gitops-test'
      dry_run:
        description: 'Run in dry-run mode (no changes pushed)'
        type: boolean
        required: false
        default: false

concurrency:
  group: ghe-mirror-sync
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to Internal GHE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute mirror sync
        env:
          SOURCE_REPO: ${{ github.repository }}
          TARGET_REPO: ${{ github.event.inputs.target_repo || 'Devansh-Raghuvanshi/mas-gitops-test' }}
          PUBLIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHE_TOKEN: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          set -e
          chmod +x ./build/bin/sync-internal-mirror.sh
          ./build/bin/sync-internal-mirror.sh \
            ${DRY_RUN} \
            --source "${SOURCE_REPO}" \
            --target "${TARGET_REPO}" \
            --public-token "${PUBLIC_TOKEN}" \
            --ghe-token "${GHE_TOKEN}"
