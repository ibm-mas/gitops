name: Update Internal GHE Mirror

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  schedule:
    # Daily reconciliation at 02:00 UTC to prune deleted branches/tags
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ghe-mirror-sync
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to Internal GHE
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repository
        env:
          SOURCE_REPO: ${{ github.repository }}
          TARGET_REPO: automation-paas-cd-pipeline/mas-gitops
          PUBLIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHE_TOKEN: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
        run: |
          set -e

          echo "Cloning source repository (mirror)..."
          git clone --mirror "https://x-access-token:${PUBLIC_TOKEN}@github.com/${SOURCE_REPO}.git" repo.git
          cd repo.git

          echo "Pushing mirror to https://github.ibm.com/${TARGET_REPO}..."
          git push --mirror "https://x-access-token:${GHE_TOKEN}@github.ibm.com/${TARGET_REPO}.git"

          echo "Mirror sync completed successfully."
