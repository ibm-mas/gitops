# Stage "custom-status-success": rendered as ConfigMap keys template.custom-status-success and trigger.on-custom-status-success
template: |
  webhook:
    slack:
      method: POST
      body: |
        {
          "attachments": [
            {
              "color": "#2EB67D",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment update for instance {{index .app.metadata.labels "instance"}}: Application Healthy ({{.app.metadata.name}})*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Instance ID:* {{index .app.metadata.labels "instance"}}"},
                    {"type": "mrkdwn", "text": "*Cluster:* {{index .app.metadata.labels "cluster"}}"},
                    {"type": "mrkdwn", "text": "*Project:* {{.app.spec.project}}"},
                    {"type": "mrkdwn", "text": "*Sync Status:* {{.app.status.sync.status}}"},
                    {"type": "mrkdwn", "text": "*Health Status:* {{.app.status.health.status}}"},
                    {"type": "mrkdwn", "text": "*Deployed by:* {{with .app.status.operationState}}{{with .operation}}{{with .initiatedBy}}{{if .username}}{{.username}}{{else}}automated{{end}}{{end}}{{end}}{{end}}"}
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Revision:* {{.app.status.sync.revision}}\n\n*ArgoCD:* <{{.context.argocdUrl}}/applications/{{.app.metadata.name}}|{{.app.metadata.name}}>"
                  }
                }
              ]
            }
          ]
        }
trigger: |
  - when: app.status.health.status == 'Healthy' && app.status.sync.status == 'Synced' && app.status.operationState?.phase not in ['Error', 'Failed'] && (app.metadata.annotations['notified.notifications.argoproj.io'] ?? '') contains 'on-custom-status-recovered:'
    send: [custom-status-success]
