# Stage "custom-status": rendered as ConfigMap keys template.custom-status and trigger.on-custom-status
template: |
  webhook:
    slack:
      method: POST
      body: |
        {
          "attachments": [
            {
              "color": "#E01E5A",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment update for instance {{index .app.metadata.labels "instance"}}: Application Failed ({{.app.metadata.name}})*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Instance ID:* {{index .app.metadata.labels "instance"}}"},
                    {"type": "mrkdwn", "text": "*Cluster:* {{index .app.metadata.labels "cluster"}}"},
                    {"type": "mrkdwn", "text": "*Project:* {{.app.spec.project}}"},
                    {"type": "mrkdwn", "text": "*Sync Status:* {{.app.status.sync.status}}"},
                    {"type": "mrkdwn", "text": "*Health Status:* {{.app.status.health.status}}"},
                    {"type": "mrkdwn", "text": "*Deployed by:* {{with .app.status.operationState}}{{with .operation}}{{with .initiatedBy}}{{if .username}}{{.username}}{{else}}automated{{end}}{{end}}{{end}}{{end}}"}
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Conditions:*\n{{range .app.status.conditions}}{{ printf "- %s: %s\n" .type .message | toJson | trimAll "\"" }}{{end}}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* {{.app.spec.source.repoURL}}\n*Revision:* {{.app.status.sync.revision}}\n\n*ArgoCD:* <{{.context.argocdUrl}}/applications/{{.app.metadata.name}}|{{.app.metadata.name}}>"
                  }
                }
              ]
            }
          ]
        }
trigger: |
  - when: app.status.health.status == 'Degraded' || app.status.operationState?.phase in ['Error', 'Failed'] || ((app.metadata.annotations['notified.notifications.argoproj.io'] ?? '') contains 'on-custom-status:' && !((app.metadata.annotations['notified.notifications.argoproj.io'] ?? '') contains 'on-custom-status-success:'))
    send: [custom-status]
