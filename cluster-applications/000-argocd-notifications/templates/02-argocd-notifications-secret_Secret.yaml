{{- if .Values.slack_webhook_url }}
---
# Adds only the "slack-webhook-url" key to the ArgoCD notifications Secret. The Secret is shared with
# other keys (e.g. slack-token, webhook-url), so this chart contributes just its own key and relies on
# ServerSideApply (set on the Application) to merge it without touching the other keys.
# It is never pruned or deleted by ArgoCD. The value is an AVP reference resolved at render time.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: {{ .Values.argo_namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
stringData:
  slack-webhook-url: {{ .Values.slack_webhook_url | quote }}
{{- end }}
