---
# Namespace of the ArgoCD instance whose notifications controller should use this configuration
argo_namespace: openshift-gitops

# Slack Incoming Webhook URL used by the custom alerts (written to the "slack-webhook-url" key of the
# argocd-notifications-secret). Pass an AVP reference, e.g.
#   <path:arn:aws:secretsmanager:us-east-2:123456789012:secret:my-account/my-cluster/slack#slack_webhook_url>
# NEVER put the plain URL in git. When empty no Secret is rendered and the key must be created by hand.
slack_webhook_url: ""
