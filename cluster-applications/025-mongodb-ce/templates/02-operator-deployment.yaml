{{- /*
Deploy the MongoDB Community Operator directly from quay.io image digest.
This matches the ansible-devops mongodb community install approach (no OLM Subscription needed).
Operator: quay.io/mongodb/mongodb-kubernetes-operator:0.9.0
*/}}
---
# Role for the operator
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-kubernetes-operator
  namespace: {{ .Values.mongodb_namespace | default "mongoce" }}
  annotations:
    argocd.argoproj.io/sync-wave: "022"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, secrets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [mongodbcommunity.mongodb.com]
    resources: [mongodbcommunity, mongodbcommunity/status, mongodbcommunity/spec, mongodbcommunity/finalizers]
    verbs: [get, patch, list, update, watch]

---
# RoleBinding for the operator
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-kubernetes-operator
  namespace: {{ .Values.mongodb_namespace | default "mongoce" }}
  annotations:
    argocd.argoproj.io/sync-wave: "022"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: mongodb-kubernetes-operator
    namespace: {{ .Values.mongodb_namespace | default "mongoce" }}
roleRef:
  kind: Role
  name: mongodb-kubernetes-operator
  apiGroup: rbac.authorization.k8s.io

---
# ServiceAccount for the operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-kubernetes-operator
  namespace: {{ .Values.mongodb_namespace | default "mongoce" }}
  annotations:
    argocd.argoproj.io/sync-wave: "022"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}

---
# Role for the database service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-database
  namespace: {{ .Values.mongodb_namespace | default "mongoce" }}
  annotations:
    argocd.argoproj.io/sync-wave: "022"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch, delete, get]

---
# RoleBinding for the database service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-database
  namespace: {{ .Values.mongodb_namespace | default "mongoce" }}
  annotations:
    argocd.argoproj.io/sync-wave: "022"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: mongodb-database
    namespace: {{ .Values.mongodb_namespace | default "mongoce" }}
roleRef:
  kind: Role
  name: mongodb-database
  apiGroup: rbac.authorization.k8s.io

---
# ServiceAccount for the database pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-database
  namespace: {{ .Values.mongodb_namespace | default "mongoce" }}
  annotations:
    argocd.argoproj.io/sync-wave: "022"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}

---
# Operator Deployment - directly from quay.io (no OLM/Subscription required)
# Image: quay.io/mongodb/mongodb-kubernetes-operator@sha256:4e1e6f82d33211ffd164a28d811b106d02546a1ce84c95625404f30a80a0c2d1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-kubernetes-operator
  namespace: {{ .Values.mongodb_namespace | default "mongoce" }}
  annotations:
    argocd.argoproj.io/sync-wave: "023"
  labels:
    owner: mongodb
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      name: mongodb-kubernetes-operator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        name: mongodb-kubernetes-operator
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: mongodb-kubernetes-operator
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: name
                    operator: In
                    values:
                      - mongodb-kubernetes-operator
              topologyKey: kubernetes.io/hostname
      containers:
        - name: mongodb-kubernetes-operator
          image: quay.io/mongodb/mongodb-kubernetes-operator@sha256:4e1e6f82d33211ffd164a28d811b106d02546a1ce84c95625404f30a80a0c2d1
          imagePullPolicy: Always
          command:
            - /usr/local/bin/entrypoint
          resources:
            limits:
              cpu: 1100m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 200Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 2000
            allowPrivilegeEscalation: false
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: mongodb-kubernetes-operator
            - name: AGENT_IMAGE
              value: "quay.io/mongodb/mongodb-agent@sha256:d5b34afd48568f5a6a9fce03c78660cbf8d3a96e7fd9a6fbe1d028b01112840f"
            - name: VERSION_UPGRADE_HOOK_IMAGE
              value: "quay.io/mongodb/mongodb-kubernetes-operator-version-upgrade-post-start-hook@sha256:893527c88d7b7acc2a5f6fe4e38d8cac5ee99bf5a8c2e4405d2fc6ed4e509bbc"
            - name: READINESS_PROBE_IMAGE
              value: "quay.io/mongodb/mongodb-kubernetes-readinessprobe@sha256:169c1f047b58134b82da6646c4fb75f3fd30599ccc3d54fffd16e56e61e8c01f"
            - name: MONGODB_IMAGE
              value: "ibmmas/mongo@sha256:34341de709b1a70f5e0339ecb1ad2aa2152ecf88e5ca825e2a764da69bbd0269"
            - name: MONGODB_REPO_URL
              value: "quay.io"
