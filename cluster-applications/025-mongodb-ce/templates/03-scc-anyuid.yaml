{{- /*
Grant anyuid SCC to the MongoDB operator and database ServiceAccounts.
This is required on OpenShift because the operator container runs as a
non-root user (UID 2000) which falls outside the namespace-allocated UID
range enforced by restricted-v2 SCC.

Uses RoleBinding (namespace-scoped) referencing system:openshift:scc:anyuid ClusterRole —
the same pattern used by the instana-agent-operator chart in this repo.

This replicates what the ansible-devops mongodb community role does with:
  oc adm policy add-scc-to-user anyuid system:serviceaccount:<ns>:mongodb-kubernetes-operator
  oc adm policy add-scc-to-user anyuid system:serviceaccount:<ns>:mongodb-database
  oc adm policy add-scc-to-user anyuid system:serviceaccount:<ns>:default
*/}}
{{- $ns := .Values.mongodb_namespace | default "mongoce" }}

---
# Grant anyuid SCC to the mongodb-kubernetes-operator ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid:operator
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "021"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: mongodb-kubernetes-operator
    namespace: {{ $ns }}
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:anyuid
  apiGroup: rbac.authorization.k8s.io

---
# Grant anyuid SCC to the mongodb-database ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid:database
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "021"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: mongodb-database
    namespace: {{ $ns }}
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:anyuid
  apiGroup: rbac.authorization.k8s.io

---
# Grant anyuid SCC to the default ServiceAccount (used by mongodb pods)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid:default
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "021"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ $ns }}
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:anyuid
  apiGroup: rbac.authorization.k8s.io
