---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: mongodb-kubernetes-operator
  namespace: {{ .Values.mongodb_namespace | default "mongoce" }}
  annotations:
    argocd.argoproj.io/sync-wave: "023"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  channel: "{{ .Values.mongodb_operator_channel | default "v0.7" }}"
  installPlanApproval: {{ .Values.mongodb_operator_install_plan | default "Automatic" | quote }}
  name: mongodb-kubernetes-operator
  source: {{ .Values.mongodb_operator_source | default "community-operators" }}
  sourceNamespace: {{ .Values.mongodb_operator_source_namespace | default "openshift-marketplace" }}
