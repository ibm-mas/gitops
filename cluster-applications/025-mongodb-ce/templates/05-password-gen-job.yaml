{{- /*
Generates random passwords for MongoDB and stores them as K8s Secrets.

Mirrors what ansible does with:
  lookup('password', '/tmp/mongoce-password.txt chars=ascii_letters,digits length=16')

This Job runs at wave 023 (PreSync hook, BeforeHookCreation delete policy) so it
fires before the admin secret (wave 024) and MongoDBCommunity CR (wave 025).

Idempotent: if Secret mas-mongo-ce-admin-password already exists and has a
non-empty password key, this job skips generation and exits 0. This means
the password is generated ONCE on first install and never rotated by re-syncs.
*/}}
{{- $ns := .Values.mongodb_namespace | default "mongoce" }}
{{- $instance := .Values.mongodb_instance_name | default "mas-mongo-ce" }}
{{- $sa_name := "mongo-password-gen-sa" }}
{{- $role_name := "mongo-password-gen-role" }}
{{- $rb_name := "mongo-password-gen-rb" }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $role_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $rb_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa_name }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $role_name }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-password-gen-job
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: {{ $sa_name }}
      restartPolicy: OnFailure
      containers:
        - name: generate-passwords
          image: quay.io/openshift/origin-cli:latest
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          env:
            - name: MONGO_NAMESPACE
              value: "{{ $ns }}"
            - name: INSTANCE_NAME
              value: "{{ $instance }}"
          command:
            - /bin/bash
            - -c
            - |
              set -e
              NS="${MONGO_NAMESPACE}"
              ADMIN_SECRET="mas-mongo-ce-admin-password"
              METRICS_SECRET="mas-mongo-ce-metrics-endpoint-secret"

              # -----------------------------------------------------------------------
              # Generate admin password
              # Idempotent: skip if secret already exists with a non-empty password.
              # Mirrors ansible: lookup('password', '/tmp/mongoce-password.txt
              #                    chars=ascii_letters,digits length=16')
              # -----------------------------------------------------------------------
              EXISTING=$(oc get secret "${ADMIN_SECRET}" -n "${NS}" \
                -o jsonpath='{.data.password}' 2>/dev/null || true)

              if [[ -n "${EXISTING}" ]]; then
                echo "Secret ${ADMIN_SECRET} already exists — skipping password generation (idempotent)"
              else
                echo "Generating random admin password for ${ADMIN_SECRET} ..."
                # Generate 16-char alphanumeric password (same charset as ansible lookup)
                ADMIN_PASSWORD=$(cat /dev/urandom \
                  | tr -dc 'A-Za-z0-9' \
                  | head -c 16)

                oc create secret generic "${ADMIN_SECRET}" \
                  -n "${NS}" \
                  --from-literal=password="${ADMIN_PASSWORD}" \
                  --dry-run=client -o yaml \
                  | oc apply -f -

                echo "Secret ${ADMIN_SECRET} created with generated password"
              fi

              # -----------------------------------------------------------------------
              # Generate metrics endpoint password
              # Idempotent: skip if secret already exists with a non-empty password.
              # -----------------------------------------------------------------------
              EXISTING_METRICS=$(oc get secret "${METRICS_SECRET}" -n "${NS}" \
                -o jsonpath='{.data.password}' 2>/dev/null || true)

              if [[ -n "${EXISTING_METRICS}" ]]; then
                echo "Secret ${METRICS_SECRET} already exists — skipping (idempotent)"
              else
                echo "Generating random metrics password for ${METRICS_SECRET} ..."
                METRICS_PASSWORD=$(cat /dev/urandom \
                  | tr -dc 'A-Za-z0-9' \
                  | head -c 16)

                oc create secret generic "${METRICS_SECRET}" \
                  -n "${NS}" \
                  --from-literal=username="metrics-endpoint-user" \
                  --from-literal=password="${METRICS_PASSWORD}" \
                  --dry-run=client -o yaml \
                  | oc apply -f -

                echo "Secret ${METRICS_SECRET} created with generated password"
              fi

              echo "Done."
