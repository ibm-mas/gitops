{{- if and .Values.run_sync_hooks .Values.cluster_admin_role }}

{{- /*
Meaningful prefix for the job resource name. Must be under 52 chars in length.
*/}}
{{- $_job_name_prefix := "postsync-mongo-update-sm-job" }}

{{- /*
CLI image digest
*/}}
{{- $_cli_image_digest := "sha256:1dc8665fddb9546b84290b0615fc7c7017e19516082b35541d41b8ea82df347b" }}

{{- $_job_config_values := omit .Values "junitreporter" }}
{{- $_job_version := "v1" }}
{{- $_job_hash := print ($_job_config_values | toYaml) $_cli_image_digest $_job_version | adler32sum }}
{{- $_job_name := join "-" (list $_job_name_prefix $_job_hash )}}
{{- $_job_cleanup_group := cat $_job_name_prefix | sha1sum }}

{{ $ns := .Values.mongodb_namespace | default "mongoce" }}
{{ $aws_secret := "mongo-aws-creds" }}
{{ $role_name := "postsync-mongo-update-sm-r" }}
{{ $sa_name := "postsync-mongo-update-sm-sa" }}
{{ $rb_name := "postsync-mongo-update-sm-rb" }}

---
kind: Secret
apiVersion: v1
metadata:
  name: {{ $aws_secret }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "026"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
data:
  aws_access_key_id: {{ .Values.sm_aws_access_key_id | default "" | b64enc }}
  aws_secret_access_key: {{ .Values.sm_aws_secret_access_key | default "" | b64enc }}
type: Opaque

---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ $sa_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "026"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $role_name }}
  annotations:
    argocd.argoproj.io/sync-wave: "026"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - ""
    resources:
      - secrets
      - services
      - pods
  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - mongodbcommunity.mongodb.com
    resources:
      - mongodbcommunity

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $rb_name }}
  annotations:
    argocd.argoproj.io/sync-wave: "027"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa_name }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $role_name }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $_job_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "028"
  labels:
    mas.ibm.com/job-cleanup-group: {{ $_job_cleanup_group }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  template:
{{- if .Values.custom_labels }}
    metadata:
      labels:
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ $sa_name }}
      restartPolicy: Never
      volumes:
        - name: aws
          secret:
            secretName: {{ $aws_secret }}
            defaultMode: 420
            optional: false
      containers:
        - name: run
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: aws
              mountPath: /etc/mas/creds/aws
          env:
            - name: ACCOUNT_ID
              value: "{{ .Values.account_id }}"
            - name: REGION_ID
              value: "{{ .Values.region_id }}"
            - name: CLUSTER_ID
              value: "{{ .Values.cluster_id }}"
            - name: MONGO_NAMESPACE
              value: "{{ $ns }}"
            - name: MONGO_INSTANCE_NAME
              value: "{{ .Values.mongodb_instance_name | default "mas-mongo-ce" }}"
            - name: MONGO_ADMIN_PASSWORD
              value: "{{ .Values.admin_password }}"
            - name: MONGO_MEMBERS
              value: "{{ .Values.mongodb_members | default 3 }}"
          command:
            - /bin/bash
            - -c
            - >
              set -e;
              source /mascli/functions/gitops_utils;
              SM_AWS_ACCESS_KEY_ID=$(cat /etc/mas/creds/aws/aws_access_key_id);
              SM_AWS_SECRET_ACCESS_KEY=$(cat /etc/mas/creds/aws/aws_secret_access_key);
              export SM_AWS_REGION=${REGION_ID};
              sm_login;
              echo "Waiting for MongoDBCommunity ${MONGO_INSTANCE_NAME} in ${MONGO_NAMESPACE}";
              for (( c=1; c<=30; c++ )); do
                echo "... check attempt ${c} of 30";
                PHASE=$(oc get mongodbcommunity "${MONGO_INSTANCE_NAME}" -n "${MONGO_NAMESPACE}" -o=jsonpath='{.status.phase}' 2>/dev/null || true);
                echo "Current Phase: ${PHASE}";
                if [[ "${PHASE}" == "Running" ]]; then
                  echo "MongoDBCommunity instance is Running!";
                  break;
                fi;
                sleep 20;
              done;
              PRIMARY_HOST="${MONGO_INSTANCE_NAME}-0.${MONGO_INSTANCE_NAME}-svc.${MONGO_NAMESPACE}.svc.cluster.local";
              CA_CERT="";
              CA_SECRET_NAME="${MONGO_INSTANCE_NAME}-ca";
              if oc get secret "${CA_SECRET_NAME}" -n "${MONGO_NAMESPACE}" >/dev/null 2>&1; then
                CA_CERT=$(oc get secret "${CA_SECRET_NAME}" -n "${MONGO_NAMESPACE}" -o=jsonpath='{.data.ca\.crt}' | base64 -d 2>/dev/null || true);
              fi;
              python3 -c "
              import os, json
              account = os.environ.get('ACCOUNT_ID')
              cluster = os.environ.get('CLUSTER_ID')
              instance_name = os.environ.get('MONGO_INSTANCE_NAME')
              namespace = os.environ.get('MONGO_NAMESPACE')
              members = int(os.environ.get('MONGO_MEMBERS', '3'))
              password = os.environ.get('MONGO_ADMIN_PASSWORD')
              ca_cert = os.environ.get('CA_CERT', '')
              primary_host = f'{instance_name}-0.{instance_name}-svc.{namespace}.svc.cluster.local'
              info_lines = ['config:', '  hosts:']
              for i in range(members):
                  info_lines.append(f'    - host: {instance_name}-{i}.{instance_name}-svc.{namespace}.svc.cluster.local')
                  info_lines.append('      port: 27017')
              info_lines.append('  configDb: admin')
              info_lines.append('  authMechanism: DEFAULT')
              if ca_cert:
                  info_lines.append('certificates:')
                  info_lines.append('  - alias: ca')
                  info_lines.append('    crt: |')
                  for line in ca_cert.strip().split('\n'):
                      info_lines.append(f'      {line}')
              info_str = '\n'.join(info_lines) + '\n'
              secret_name = f'{account}/{cluster}/mongo'
              payload = {
                  'docdb_host': primary_host,
                  'docdb_port': '27017',
                  'username': 'admin',
                  'password': password,
                  'info': info_str
              }
              tags = json.dumps([
                  {'Key': 'source', 'Value': 'postsync-mongo-update-sm-job'},
                  {'Key': 'account', 'Value': account},
                  {'Key': 'cluster', 'Value': cluster}
              ])
              with open('/tmp/secret_payload.json', 'w') as f:
                  f.write(json.dumps(payload))
              with open('/tmp/secret_tags.json', 'w') as f:
                  f.write(tags)
              ";
              SECRET_NAME_MONGO="${ACCOUNT_ID}/${CLUSTER_ID}/mongo";
              echo "Updating AWS Secret: ${SECRET_NAME_MONGO}";
              sm_update_secret "${SECRET_NAME_MONGO}" "$(cat /tmp/secret_payload.json)" "$(cat /tmp/secret_tags.json)" || exit $?;
              echo "Successfully registered MongoDB credentials and info secret to AWS Secrets Manager!"
  backoffLimit: 4
{{- end }}
