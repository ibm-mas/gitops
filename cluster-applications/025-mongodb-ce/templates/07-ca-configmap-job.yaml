{{- /*
Extract ca.crt from the cert-manager-generated Secret 'mongo-ca-secret' and write it into
ConfigMap 'mas-mongo-ce-cert-map' — exactly what the ansible role does in tls.yml after
reading mongodb_ca_lookup.resources[0].data['ca.crt'].

The ConfigMap is referenced by the MongoDBCommunity CR at:
  spec.security.tls.caConfigMapRef.name: mas-mongo-ce-cert-map

This must run AFTER cert-manager has issued mongo-ca-secret (waves 023-024) and
BEFORE the MongoDBCommunity CR (wave 025).
*/}}
{{- $ns := .Values.mongodb_namespace | default "mongoce" }}
{{- $sa_name := "mongo-ca-configmap-sa" }}
{{- $role_name := "mongo-ca-configmap-role" }}
{{- $rb_name := "mongo-ca-configmap-rb" }}
{{- $job_name := "mongo-ca-configmap-job" }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "024"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $role_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "024"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $rb_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "024"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa_name }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $role_name }}

---
# Job: extract ca.crt from mongo-ca-secret → create mas-mongo-ce-cert-map ConfigMap
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "024"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: {{ $sa_name }}
      restartPolicy: OnFailure
      containers:
        - name: create-ca-configmap
          image: quay.io/openshift/origin-cli:latest
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          command:
            - /bin/bash
            - -c
            - |
              set -e
              NS="{{ $ns }}"
              INSTANCE="{{ .Values.mongodb_instance_name | default "mas-mongo-ce" }}"
              CA_SECRET="mongo-ca-secret"
              CM_NAME="mas-mongo-ce-cert-map"

              echo "Waiting for cert-manager to issue ${CA_SECRET} ..."
              for (( i=1; i<=30; i++ )); do
                if oc get secret "${CA_SECRET}" -n "${NS}" >/dev/null 2>&1; then
                  echo "  secret found on attempt ${i}"
                  break
                fi
                echo "  attempt ${i}/30 — not ready yet, sleeping 10s ..."
                sleep 10
              done

              CA_CRT=$(oc get secret "${CA_SECRET}" -n "${NS}" \
                -o jsonpath='{.data.ca\.crt}' | base64 -d)

              if [[ -z "${CA_CRT}" ]]; then
                echo "ERROR: ca.crt is empty in secret ${CA_SECRET}"
                exit 1
              fi

              echo "Extracted CA certificate (${#CA_CRT} bytes), creating ConfigMap ${CM_NAME} ..."

              # Write literal YAML so the cert indentation is preserved correctly
              CA_CRT_INDENTED=$(echo "${CA_CRT}" | sed 's/^/    /')

              oc apply -n "${NS}" -f - << YAML
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ${CM_NAME}
                namespace: ${NS}
              data:
                ca.crt: |
              ${CA_CRT_INDENTED}
              YAML

              echo "SUCCESS: ConfigMap ${CM_NAME} created/updated"
