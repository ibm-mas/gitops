{{- if and .Values.run_sync_hooks .Values.cluster_admin_role }}

{{- /*
Meaningful prefix for the job resource name. Must be under 52 chars in length to leave room for the 11 chars reserved for '-' and $_job_hash.
*/}}
{{- $_job_name_prefix := "postsync-mongo-update-sm-job" }}

{{- /*
Use the build/bin/set-cli-image-digest.sh script to update this value across all charts.
Included in $_job_hash (see below).
*/}}
{{- $_cli_image_digest := "sha256:1dc8665fddb9546b84290b0615fc7c7017e19516082b35541d41b8ea82df347b" }}

{{- /*
A dict of values that influence the behaviour of the job in some way.
Any changes to values in this dict will trigger a rerun of the job.
*/}}
{{- $_job_config_values := omit .Values "junitreporter" }}

{{- /*
Increment this value whenever you make a change to an immutable field of the Job resource.
*/}}
{{- $_job_version := "v5" }}

{{- /*
10 char hash appended to the job name taking into account $_job_config_values, $_job_version and $_cli_image_digest
*/}}
{{- $_job_hash := print ($_job_config_values | toYaml) $_cli_image_digest $_job_version | adler32sum }}

{{- $_job_name := join "-" (list $_job_name_prefix $_job_hash )}}

{{- /*
Set as the value for the mas.ibm.com/job-cleanup-group label on the Job resource.
*/}}
{{- $_job_cleanup_group := cat $_job_name_prefix | sha1sum }}



{{ $ns := .Values.mongodb_namespace | default "mongoce" }}
{{ $aws_secret := "aws" }}
{{ $np_name :=   "postsync-mongo-update-sm-np" }}
{{ $role_name := "postsync-mongo-update-sm-r" }}
{{ $sa_name :=   "postsync-mongo-update-sm-sa" }}
{{ $rb_name :=   "postsync-mongo-update-sm-rb" }}
{{ $job_label := "postsync-mongo-update-sm-job" }}



---
# Permit outbound communication by the Job pods
# (Needed to communicate with the K8S HTTP API and AWS SM)
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ $np_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "026"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  podSelector:
    matchLabels:
      app: {{ $job_label }}
  egress:
    - {}
  policyTypes:
    - Egress


---
kind: Secret
apiVersion: v1
metadata:
  name: {{ $aws_secret }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "026"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
data:
  aws_access_key_id: {{ .Values.sm_aws_access_key_id | b64enc }}
  aws_secret_access_key: {{ .Values.sm_aws_secret_access_key | b64enc }}
type: Opaque

---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ $sa_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "026"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}

---
# Namespace-scoped Role: allows the job to read secrets (admin password, metrics password)
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $role_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "026"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - verbs:
      - get
    apiGroups:
      - ""
    resources:
      - secrets

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $rb_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "027"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa_name }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $role_name }}

---
# ClusterRole: allows the job to read the MongoDBCommunity CR (cluster-scoped CRD)
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $role_name }}-cr
  annotations:
    argocd.argoproj.io/sync-wave: "026"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - verbs:
      - get
    apiGroups:
      - mongodbcommunity.mongodb.com
    resources:
      - mongodbcommunity

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $rb_name }}-cr
  annotations:
    argocd.argoproj.io/sync-wave: "027"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa_name }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $role_name }}-cr

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $_job_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "028"
    argocd.argoproj.io/sync-options: Prune=true
  labels:
    mas.ibm.com/job-cleanup-group: {{ $_job_cleanup_group }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  template:
    metadata:
      labels:
        app: {{ $job_label }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      containers:
        - name: run
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          env:
            - name: ACCOUNT_ID
              value: {{ .Values.account_id }}
            - name: REGION_ID
              value: {{ .Values.region_id }}
            - name: CLUSTER_ID
              value: {{ .Values.cluster_id }}
            - name: MONGO_NAMESPACE
              value: {{ $ns }}
            - name: MONGO_INSTANCE_NAME
              value: {{ .Values.mongodb_instance_name | default "mas-mongo-ce" }}
            - name: MONGO_MEMBERS
              value: "{{ .Values.mongodb_members | default 3 }}"
            # Hard-coded for now:
            - name: AVP_TYPE
              value: "aws"
          volumeMounts:
            - name: aws
              mountPath: /etc/mas/creds/aws
          command:
            - /bin/sh
            - -c
            - |

              set -e

              # NOTE: cannot just render AWS secrets into here, as it will be exposed in the ArgoCD UI
              # Instead, we pass them into a secret (ArgoCD knows to hide any data fields in k8s secrets),
              # mount the secret on the jobs filesystem, and read them in here
              SM_AWS_ACCESS_KEY_ID=$(cat /etc/mas/creds/aws/aws_access_key_id)
              SM_AWS_SECRET_ACCESS_KEY=$(cat /etc/mas/creds/aws/aws_secret_access_key)

              # might as well take advantage of gitops_utils for sm_ functions as we're using the cli image
              source /mascli/functions/gitops_utils

              export SM_AWS_REGION=${REGION_ID}
              sm_login

              # ---------------------------------------------------------------------------
              # Wait for MongoDBCommunity CR to reach Running phase
              # ---------------------------------------------------------------------------
              echo "Waiting for MongoDBCommunity/${MONGO_INSTANCE_NAME} in namespace ${MONGO_NAMESPACE} ..."
              PHASE=""
              for (( c=1; c<=30; c++ )); do
                echo "  attempt ${c}/30 ..."
                PHASE=$(oc get mongodbcommunity "${MONGO_INSTANCE_NAME}" -n "${MONGO_NAMESPACE}" \
                  -o jsonpath='{.status.phase}' 2>/dev/null || true)
                echo "  phase=${PHASE}"
                [[ "${PHASE}" == "Running" ]] && break
                sleep 20
              done
              if [[ "${PHASE}" != "Running" ]]; then
                echo "ERROR: MongoDBCommunity did not reach Running phase after 10 minutes. Aborting."
                exit 1
              fi

              # ---------------------------------------------------------------------------
              # Read the admin password from the operator-generated secret.
              # Name pattern: <CR-name>-admin-admin (e.g. mas-mongo-ce-admin-admin)
              # ---------------------------------------------------------------------------
              ADMIN_SECRET_NAME="${MONGO_INSTANCE_NAME}-admin-admin"
              echo "Reading admin password from secret: ${ADMIN_SECRET_NAME}"
              MONGO_ADMIN_PASSWORD=""
              for (( c=1; c<=30; c++ )); do
                echo "  attempt ${c}/30 ..."
                MONGO_ADMIN_PASSWORD=$(oc get secret "${ADMIN_SECRET_NAME}" -n "${MONGO_NAMESPACE}" \
                  -o jsonpath='{.data.password}' 2>/dev/null | base64 -d 2>/dev/null || true)
                if [[ -n "${MONGO_ADMIN_PASSWORD}" ]]; then
                  echo "  admin password retrieved (${#MONGO_ADMIN_PASSWORD} chars)"
                  break
                fi
                sleep 20
              done
              if [[ -z "${MONGO_ADMIN_PASSWORD}" ]]; then
                echo "ERROR: Could not read admin password from secret ${ADMIN_SECRET_NAME} after 10 minutes."
                exit 1
              fi

              # ---------------------------------------------------------------------------
              # Read metrics password from the operator-generated metrics secret.
              # ---------------------------------------------------------------------------
              MONGO_METRICS_PASSWORD=$(oc get secret "${MONGO_INSTANCE_NAME}-metrics-endpoint-secret" \
                -n "${MONGO_NAMESPACE}" -o jsonpath='{.data.password}' 2>/dev/null \
                | base64 -d 2>/dev/null || true)

              # ---------------------------------------------------------------------------
              # Fetch CA certificate
              # ---------------------------------------------------------------------------
              CA_CERT_PEM=""
              for CA_SECRET_NAME in "mongo-ca-secret" "${MONGO_INSTANCE_NAME}-ca"; do
                if oc get secret "${CA_SECRET_NAME}" -n "${MONGO_NAMESPACE}" >/dev/null 2>&1; then
                  echo "Found CA secret ${CA_SECRET_NAME}, extracting certificate ..."
                  CA_CERT_PEM=$(oc get secret "${CA_SECRET_NAME}" -n "${MONGO_NAMESPACE}" \
                    -o jsonpath='{.data.ca\.crt}' | base64 -d 2>/dev/null || true)
                  if [[ -n "${CA_CERT_PEM}" ]]; then
                    echo "CA certificate extracted from ${CA_SECRET_NAME} (${#CA_CERT_PEM} bytes)"
                    break
                  fi
                fi
              done
              if [[ -z "${CA_CERT_PEM}" ]]; then
                echo "WARNING: No CA certificate found - secret will be written without TLS certificate"
              fi

              # ---------------------------------------------------------------------------
              # Build the 'info' YAML block (hosts + optional CA cert)
              # ---------------------------------------------------------------------------
              INFO_YAML="config:"$'\n'"  hosts:"
              for (( i=0; i<MONGO_MEMBERS; i++ )); do
                INFO_YAML+=$'\n'"    - host: ${MONGO_INSTANCE_NAME}-${i}.${MONGO_INSTANCE_NAME}-svc.${MONGO_NAMESPACE}.svc.cluster.local"
                INFO_YAML+=$'\n'"      port: 27017"
              done
              INFO_YAML+=$'\n'"  configDb: admin"
              INFO_YAML+=$'\n'"  authMechanism: DEFAULT"

              if [[ -n "${CA_CERT_PEM}" ]]; then
                INFO_YAML+=$'\n'"certificates:"
                INFO_YAML+=$'\n'"  - alias: ca"
                INFO_YAML+=$'\n'"    crt: |"
                while IFS= read -r cert_line; do
                  INFO_YAML+=$'\n'"      ${cert_line}"
                done <<< "${CA_CERT_PEM}"
              fi

              echo "--- info YAML ---"
              echo "${INFO_YAML}"
              echo "-----------------"

              # ---------------------------------------------------------------------------
              # Build JSON payload using jq to safely escape all field values,
              # then write to AWS Secrets Manager.
              # jq --arg handles newlines and special characters in INFO_YAML correctly,
              # storing info as plain text (not encoded) in AWS Secrets Manager.
              # ---------------------------------------------------------------------------
              PRIMARY_HOST="${MONGO_INSTANCE_NAME}-0.${MONGO_INSTANCE_NAME}-svc.${MONGO_NAMESPACE}.svc.cluster.local"

              SECRET_VALUE=$(jq -n \
                --arg docdb_host       "${PRIMARY_HOST}" \
                --arg docdb_port       "27017" \
                --arg username         "admin" \
                --arg password         "${MONGO_ADMIN_PASSWORD}" \
                --arg admin_password   "${MONGO_ADMIN_PASSWORD}" \
                --arg metrics_password "${MONGO_METRICS_PASSWORD}" \
                --arg info             "${INFO_YAML}" \
                '{docdb_host: $docdb_host, docdb_port: $docdb_port, username: $username, password: $password, admin_password: $admin_password, metrics_password: $metrics_password, info: $info}')

              SECRET_NAME_MONGO="${ACCOUNT_ID}/${CLUSTER_ID}/mongo"
              TAGS="[{\"Key\": \"source\", \"Value\": \"postsync-mongo-update-sm-job\"}, {\"Key\": \"account\", \"Value\": \"${ACCOUNT_ID}\"}, {\"Key\": \"cluster\", \"Value\": \"${CLUSTER_ID}\"}]"

              sm_update_secret $SECRET_NAME_MONGO "${SECRET_VALUE}" "${TAGS}"

              echo "SUCCESS: MongoDB credentials stored at ${SECRET_NAME_MONGO}"

      restartPolicy: Never

      serviceAccountName: {{ $sa_name }}
      volumes:
        - name: aws
          secret:
            secretName: {{ $aws_secret }}
            defaultMode: 420
            optional: false

  backoffLimit: 4
{{- end }}
