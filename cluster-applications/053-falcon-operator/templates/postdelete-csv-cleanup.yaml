
{{- /*
Use the build/bin/set-cli-image-digest.sh script to update this value across all charts.
*/}}
{{- $_cli_image_digest := "sha256:c715f4cdc38d1fded23cd9f1c22f30f8668618e73905fd11edf4a1184f25e1bb" }}

{{- $job_name    := "postdelete-delete-csv-job" }}
{{- $role_name   := "postdelete-delete-csv-r" }}
{{- $sa_name     := "postdelete-delete-csv-sa" }}
{{- $rb_name     := "postdelete-delete-csv-rb" }}
{{- $job_label   := "postdelete-delete-csv-job" }}
{{- $ns          := "falcon-operator" }}
{{- $sub_name    := "falcon-operator" }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "000"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $role_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "000"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - verbs:
      - get
      - list
      - delete
    apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
      - clusterserviceversions

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $rb_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "001"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa_name }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $role_name }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  template:
    metadata:
      labels:
        app: {{ $job_label }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      containers:
        - name: run
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          env:
            - name: NAMESPACE
              value: {{ $ns }}
            - name: SUBSCRIPTION_NAME
              value: {{ $sub_name }}
          volumeMounts: []
          command:
            - /bin/sh
            - -c
            - |

              set -e

              echo "Deleting Subscription ${SUBSCRIPTION_NAME} in namespace ${NAMESPACE}"
              set +e
              oc delete subscription ${SUBSCRIPTION_NAME} -n ${NAMESPACE} --ignore-not-found --timeout=60s
              set -e

              echo "Deleting ClusterServiceVersions in namespace ${NAMESPACE}"
              set +e
              oc delete clusterserviceversion -n ${NAMESPACE} --all --timeout=120s
              set -e

              echo "CSV cleanup complete"

      restartPolicy: Never
      serviceAccountName: {{ $sa_name }}
      volumes: []
  backoffLimit: 4
