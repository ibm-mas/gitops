{{- if .Values.application_admin_role }}
{{- if .Values.use_postdelete_hooks }}

{{- /*
RBAC resources for supporting the PostDelete hook in 09-postdelete-delete-cr.yaml.
Annotated as PostDelete hooks so ArgoCD creates them at delete time before the
PostDelete job that depends on them runs.
*/}}

{{- $ns       := printf "mas-%s-sls" .Values.instance_id }}
{{- $sa_name  := "postdelete-sls-sa" }}
{{- $role_name := "postdelete-sls-r" }}
{{- $rb_name  := "postdelete-sls-rb" }}
{{- $np_name  := "postdelete-sls-np" }}
{{ $job_label := "postdelete-delete-cr-job" }}

---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ $np_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  podSelector:
    matchLabels:
      app: {{ $job_label }}
  egress:
    - {}
  policyTypes:
    - Egress

---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ $sa_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $role_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - verbs:
      - delete
      - get
      - list
    apiGroups:
      - sls.ibm.com
    resources:
      - licenseservices
  - verbs:
      - delete
      - get
      - list
    apiGroups:
      - operators.coreos.com
    resources:
      - clusterserviceversions
      - subscriptions

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $rb_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa_name }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $role_name }}

{{- end }}
{{- end }}
