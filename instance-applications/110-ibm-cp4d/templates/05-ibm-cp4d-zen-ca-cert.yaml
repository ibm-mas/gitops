{{- if not (lt (semver "5.4.0" | (semver (.Values.cpd_product_version | default "0.0.0" | toString)).Compare) 0) }}
---
# Pre-create zen-ca-cert-secret at sync-wave 084 using cs-ca-issuer, ahead of the Zen install.
#
# Observed on a fresh CPD 5.4.0 install: ZenService lite-cr stuck at 3% with
#   "CA CERT FAILURE. zen-ca-cert-secret not created yet"
# and zen-ca-operand-request reporting "Not found configmap ibm-platformui-operator".
# Root cause not established.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zen-ca-certificate
  namespace: "{{ .Values.cpd_instance_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "084"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  secretName: zen-ca-cert-secret
  isCA: true
  commonName: zen-ca
  duration: 87600h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: cs-ca-issuer
    kind: Issuer
{{- end }}
