{{- if .Values.cluster_admin_role }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: namespace-scope
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "062"
data:
  namespaces: {{ append (.Values.db2_additional_namespaces | default list) .Values.db2_namespace | join "," | quote }}
{{- end }}
