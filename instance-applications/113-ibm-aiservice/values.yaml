---
mas_instance_id: "sremat"
aiservice_namespace: 'mas-{{ mas_instance_id }}-aiservice'
aiservice_instance_id: "AISERVICE_INSTANCE_ID"

# Minio
mas_aiservice_minio_secret: "{{ mas_app_id }}-miniocfg"

# MariaDB
mas_aiservice_mariadb_secret: "{{ mas_app_id }}-mariadbcfg"
mas_aiservice_db_user: "MAS_AISERVICE_DB_USER"
mas_aiservice_db_secret_value: "MAS_AISERVICE_DB_SECRET_VALUE"

# WatsonX
mas_aiservice_watsonx_secret: "{{ mas_app_id }}-watsonxcfg"
mas_aiservice_watsonxai_apikey: "MAS_AISERVICE_WATSONXAI_APIKEY"
mas_aiservice_watsonxai_url: "MAS_AISERVICE_WATSONXAI_URL"
mas_aiservice_watsonxai_project_id: "MAS_AISERVICE_WATSONXAI_PROJECT_ID"


# S3
s3_apikey: "S3_APIKEY"
mas_aiservice_storage_accesskey: "true"
mas_aiservice_storage_secretkey: "MAS_AISERVICE_STORAGE_SECRETKEY"

mas_aiservice_storage_host: "true"
mas_aiservice_storage_port: "true"


mas_aiservice_db_host: "MAS_AISERVICE_DB_HOST"
mas_aiservice_db_port: "MAS_AISERVICE_DB_PORT"
mas_aiservice_db_secret_name: "MAS_AISERVICE_DB_SECRET_NAME"

# Bucket names
mas_aiservice_storage_pipelines_bucket: "MAS_AISERVICE_STORAGE_PIPELINES_BUCKET"
mas_aiservice_storage_tenants_bucket: "MAS_AISERVICE_STORAGE_TENANTS_BUCKET"
mas_aiservice_storage_templates_bucket: "MAS_AISERVICE_STORAGE_TEMPLATES_BUCKET"


#  DRO
mas_aiservice_dro_token_secret: "dro-token"
mas_aiservice_dro_cacert_secret: "dro-certificates"

dro_ca_b64enc: "ca.crt"
dro_api_token: "DRO_API_TOKEN"
dro_url: "dro_url"

# JDBC
mas_aiservice_db2_jdbc_secret: "aiservice-jdbccfg"

jdbccfg_username: "username"
jdbccfg_password: "password"
jdbccfg_url: "url"
jdbccfg_sslenabled: "sslenabled"
jdbccfg_ca: "ca"


# MAS Entitlement
mas_entitlement_username: "cp"
mas_entitlement_key: "MAS_ENTITLEMENT_KEY"

# Development Registry Entitlement
artifactory_username: "ARTIFACTORY_USERNAME"
artifactory_token: "ARTIFACTORY_TOKEN"

# Environment Variable:
mas_app_channel: "mas_app_channel"

# aiservice vars
mas_catalog_source: "MAS_CATALOG_SOURCE"

# Source container registry
# -----------------------------------------------------------------------------
mas_icr_cp: "cp.icr.io/cp"
mas_icr_cpopen: "icr.io/cpopen"

cluster_domain: "_cluster_dns.resources[0].spec.baseDomain"
in_saas_env: "false"
is_gitops_fvt_env: "false"

#TENANT
mas_aiservice_tenant_name: "aiservice-{{ mas_aiservice_tenant_name }}"

#AIService Values
aiservice:
  artifactory_token: "{{ .Values.artifactory_token }}"
  aiservice_s3_accesskey: "{{ .Values.aiservice_s3_accesskey }}"
  aiservice_s3_secretkey: "{{ .Values.aiservice_s3_secretkey }}"

  aiservice_s3_host: "{{ .Values.aiservice_s3_host }}"
  aiservice_s3_port: "{{ .Values.aiservice_s3_port }}"
  aiservice_s3_ssl: "{{ .Values.aiservice_s3_ssl }}"
  aiservice_s3_region: "{{ .Values.aiservice_s3_region }}"
  # artifactory_token: "<path:arn:aws:secretsmanager:us-west-2:435377327995:secret:fyre-dev-aiservice2/aisvc-saas/ibm_entitlement#image_pull_secret_b64>"
  # aiservice_s3_host: "<path:arn:aws:secretsmanager:us-west-2:435377327995:secret:fyre-dev-aiservice2/aisvc-saas/s3#sm_s3_host>"
  # aiservice_s3_port: ""
  # aiservice_s3_ssl: "true"
  # aiservice_s3_region: "<path:arn:aws:secretsmanager:us-west-2:435377327995:secret:fyre-dev-aiservice2/aisvc-saas/s3#sm_s3_region>"
  # aiservice_s3_accesskey: "<path:arn:aws:secretsmanager:us-west-2:435377327995:secret:fyre-dev-aiservice2/aisvc-saas/s3#sm_s3_accesskey>"
  # aiservice_s3_secretkey: "<path:arn:aws:secretsmanager:us-west-2:435377327995:secret:fyre-dev-aiservice2/aisvc-saas/s3#sm_s3_secretkey>"