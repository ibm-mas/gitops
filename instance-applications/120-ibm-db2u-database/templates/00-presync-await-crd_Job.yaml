{{- if .Values.application_admin_role }}
{{- /*
Use the build/bin/set-cli-image-digest.sh script to update this value across all charts.
*/}}
{{- $_cli_image_digest := "sha256:1dc8665fddb9546b84290b0615fc7c7017e19516082b35541d41b8ea82df347b" }}

---
# Service account that is authorized to read k8s secrets (needed by the job)
kind: ServiceAccount
apiVersion: v1
metadata:
  name: "presync-sa-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}


---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "db2-database-presync-sa-role-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
- apiGroups:
    - db2u.databases.ibm.com
  resources:
    - db2uinstances
  verbs:
    - get
    - list
    - patch
    - update
- apiGroups:
    - ""
  resources:
    - pods
  verbs:
    - get
    - list
- apiGroups:
    - ""
  resources:
    - pods/exec
  verbs:
    - create
    - get
    - list
- apiGroups:
    - ""
  resources:
    - configmaps
  verbs:
    - create
    - get
    - list
    - update
    - patch
    - delete



---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "db2-database-presync-sa-rb-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: "presync-sa-{{ .Values.db2_instance_name }}"
    namespace: "{{ .Values.db2_namespace }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "db2-database-presync-sa-role-{{ .Values.db2_instance_name }}"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: "presync-await-crd-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  template:
{{- if .Values.custom_labels }}
    metadata:
      labels:
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      containers:
        - name: run
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          env:
            - name: DB2_NAMESPACE
              value: "{{ .Values.db2_namespace }}"
            - name: DB2_INSTANCE_NAME
              value: "{{ .Values.db2_instance_name }}"
            - name: TARGET_DB2_VERSION
              value: "{{ .Values.db2_version }}"
            - name: REPLICA_DB
              value: "{{ .Values.replica_db | default false }}"
            - name: DB2_DBNAME
              value: "{{ .Values.db2_dbname }}"
          volumeMounts: []
          command:
            - /bin/sh
            - -c
            - |

              set -e

              # Wait for DB2 CRD to be available by checking if we can query the resource
              wait_period=0
              echo "Waiting for DB2 CRD (db2uinstances) to be available..."
              
              while true
              do
                wait_period=$(($wait_period+10))
                if [ $wait_period -gt 300 ];then
                  echo "DB2 CRD db2uinstances is not ready within 300 seconds, exiting"
                  exit 1
                fi
                
                sleep 10
                
                if oc get db2uinstances -n "${DB2_NAMESPACE}" --no-headers 2>/dev/null; then
                  echo "DB2 CRD db2uinstances.db2u.databases.ibm.com is available"
                  break
                fi
                
                echo "DB2 CRD not yet available, waiting... (${wait_period}s elapsed)"
              done
              echo "DB2 CRD is ready"

              # Check if HADR Primary DB version upgrade is being initiated
              if [[ "${DB2_INSTANCE_NAME}" != *"sdb"* ]] && [[ -n "${TARGET_DB2_VERSION}" ]] && [[ "${REPLICA_DB}" == "true" ]]; then
                UPGRADE_CM="hadr-upgrade-in-progress-${DB2_INSTANCE_NAME}"
                DB_NAME="${DB2_DBNAME:-BLUDB}"

                if oc get db2uinstance "${DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                  CURRENT_VERSION=$(oc get db2uinstance "${DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.spec.version}')
                  echo "Checking Db2 version: Current=${CURRENT_VERSION}, Target=${TARGET_DB2_VERSION}"

                  if [[ -n "${CURRENT_VERSION}" ]] && [[ "${CURRENT_VERSION}" != "${TARGET_DB2_VERSION}" ]] && [[ "${TARGET_DB2_VERSION}" == "s12."* || "${TARGET_DB2_VERSION}" == "12."* ]]; then
                    echo "================================================================================"
                    echo "HADR Version drift detected. Initiating PreSync upgrade preparation..."
                    echo "================================================================================"

                    # 1. Process Standby-specific pre-upgrade check while HADR is connected
                    SDB_INSTANCE_NAME="${DB2_INSTANCE_NAME}-sdb"
                    if oc get db2uinstance "${SDB_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                      DB_NAME="${DB2_DBNAME:-BLUDB}"

                      # Use manage_hadr -status as the authoritative check — this is the same
                      # command db2ckupgrade uses internally to verify standby role.
                      # db2pd -hadr can report a stale role even when HADR is not actively running.
                      echo "Checking if standby pod c-${SDB_INSTANCE_NAME}-db2u-0 is in HADR standby mode (via manage_hadr)..."
                      STANDBY_HADR_ROLE=$(oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "manage_hadr -status | grep -i hadr_role | awk -F= '{print \$2}' | sed 's/^[[:space:]]*//' | tr -d '\n'" 2>/dev/null || true)
                      echo "Standby HADR role (manage_hadr): '${STANDBY_HADR_ROLE}'"

                      if [[ "${STANDBY_HADR_ROLE}" != "STANDBY" ]]; then
                        echo "Standby pod is not in standby mode (role='${STANDBY_HADR_ROLE}'). Starting HADR in standby mode..."
                        oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "
                          db2stop force || true
                          db2start
                          sleep 60
                          db2 start hadr on db ${DB_NAME} as standby
                        " || true

                        echo "HADR standby start attempted. Re-checking role via manage_hadr..."
                        STANDBY_HADR_ROLE=$(oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "manage_hadr -status | grep -i hadr_role | awk -F= '{print \$2}' | sed 's/^[[:space:]]*//' | tr -d '\n'" 2>/dev/null || true)
                        echo "Standby HADR role after start attempt: '${STANDBY_HADR_ROLE}'"

                        if [[ "${STANDBY_HADR_ROLE}" != "STANDBY" ]]; then
                          echo "ERROR: Standby pod is still not in standby mode after start attempt (role='${STANDBY_HADR_ROLE}'). Cannot proceed with annotation."
                          exit 1
                        fi
                      else
                        echo "Standby pod is already in standby mode. Proceeding with annotation."
                      fi

                      # A previous failed PreSync run may have stopped HADR on the standby
                      # (line below) without completing, leaving the database in ROLL-FORWARD
                      # PENDING state (SQL1117N). db2ckupgrade's health check tries to activate
                      # the database and fails with that error. Detect and resolve it before
                      # annotating so the operator's job can activate the database cleanly.
                      echo "Checking if standby database ${DB_NAME} is in roll-forward pending state..."
                      RF_CHECK=$(oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "db2 activate database ${DB_NAME} 2>&1 || true" 2>/dev/null || true)
                      if echo "${RF_CHECK}" | grep -q "SQL1117N"; then
                        echo "Database ${DB_NAME} is in roll-forward pending state. Rolling forward to end of logs and stopping..."
                        oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "
                          db2 rollforward database ${DB_NAME} to end of logs and stop
                        " || true
                        echo "Verifying database can now be activated..."
                        RF_CHECK=$(oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "db2 activate database ${DB_NAME} 2>&1 || true" 2>/dev/null || true)
                        if echo "${RF_CHECK}" | grep -q "SQL1117N"; then
                          echo "ERROR: Database ${DB_NAME} is still in roll-forward pending state after rollforward attempt. Cannot proceed."
                          exit 1
                        fi
                        echo "Database ${DB_NAME} is no longer in roll-forward pending state."
                      else
                        echo "Database ${DB_NAME} is not in roll-forward pending state."
                      fi

                      MAX_UPGRADE_CHECK_RETRIES=5
                      upgrade_check_attempt=0
                      while true; do
                        upgrade_check_attempt=$((upgrade_check_attempt+1))
                        echo "Annotating Standby ${SDB_INSTANCE_NAME} with db2ckupgrade_hadr=initialize (attempt ${upgrade_check_attempt}/${MAX_UPGRADE_CHECK_RETRIES})..."
                        oc annotate db2uinstance "${SDB_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" \
                          db2u.databases.ibm.com/db2ckupgrade_hadr=initialize --overwrite

                        echo "Waiting for Standby condition Db2CheckUpgradeHadrSuccess=True..."
                        check_count=0
                        upgrade_check_result=""
                        while true; do
                          CHECK_STATUS=$(oc get db2uinstance "${SDB_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.status.conditions[?(@.type=="Db2CheckUpgradeHadrSuccess")].status}' 2>/dev/null || true)
                          if [ "${CHECK_STATUS}" = "True" ]; then
                            echo "Standby Db2CheckUpgradeHadrSuccess condition is True."
                            upgrade_check_result="success"
                            break
                          fi
                          CHECK_FAIL=$(oc get db2uinstance "${SDB_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.status.conditions[?(@.type=="Db2CheckUpgradeHadrFailure")].status}' 2>/dev/null || true)
                          if [ "${CHECK_FAIL}" = "True" ]; then
                            echo "Standby upgrade check reported failure on attempt ${upgrade_check_attempt}/${MAX_UPGRADE_CHECK_RETRIES}."
                            upgrade_check_result="failure"
                            break
                          fi
                          check_count=$((check_count+1))
                          if [ $check_count -gt 30 ]; then
                            echo "Timeout waiting for Standby Db2CheckUpgradeHadrSuccess after 300s on attempt ${upgrade_check_attempt}/${MAX_UPGRADE_CHECK_RETRIES}."
                            upgrade_check_result="timeout"
                            break
                          fi
                          echo "... waiting for Db2CheckUpgradeHadrSuccess (attempt ${check_count}/30)..."
                          sleep 10
                        done

                        if [ "${upgrade_check_result}" = "success" ]; then
                          break
                        fi

                        if [ ${upgrade_check_attempt} -ge ${MAX_UPGRADE_CHECK_RETRIES} ]; then
                          echo "ERROR: Standby upgrade check did not succeed after ${MAX_UPGRADE_CHECK_RETRIES} attempts. Check \${SUPPORTDIR}/db2_upgrade_check.log on standby pod."
                          exit 1
                        fi

                        # db2ckupgrade stops HADR internally then tries to activate the database,
                        # which can leave it in ROLL-FORWARD PENDING (SQL1117N). Resolve before retry.
                        echo "Checking if standby database ${DB_NAME} is in roll-forward pending state after upgrade check failure..."
                        RF_CHECK=$(oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "db2 activate database ${DB_NAME} 2>&1 || true" 2>/dev/null || true)
                        if echo "${RF_CHECK}" | grep -q "SQL1117N"; then
                          echo "Database ${DB_NAME} is in roll-forward pending state. Rolling forward to end of logs and stopping..."
                          oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "
                            db2 rollforward database ${DB_NAME} to end of logs and stop
                          " || true
                          echo "Roll-forward complete."
                        fi

                        echo "Retrying annotation in 30s..."
                        sleep 30
                      done
                      echo "Standby upgrade check step finished."

                      # Annotation check succeeded — clear HADR cfg params on the standby pod
                      # so the operator can configure them fresh for the v12 upgrade.
                      echo "Clearing HADR database configuration parameters on standby c-${SDB_INSTANCE_NAME}-db2u-0..."
                      oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "
                        db2 \"UPDATE DB CFG FOR ${DB_NAME} USING HADR_LOCAL_HOST NULL HADR_LOCAL_SVC NULL HADR_REMOTE_HOST NULL HADR_REMOTE_SVC NULL HADR_REMOTE_INST NULL HADR_TARGET_LIST NULL\" || true
                        db2 deactivate database ${DB_NAME} || true
                      " 2>/dev/null || true
                      echo "HADR configuration parameters cleared on standby."

                      echo "Stopping HADR and isolating Standby (c-${SDB_INSTANCE_NAME}-db2u-0)..."
                      oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- sv stop governor 2>/dev/null || true
                      oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "
                        db2 stop hadr on db ${DB_NAME} || true
                        db2set DB2COMM=''
                        db2 force application all
                        db2 terminate
                        db2 deactivate database ${DB_NAME} || true
                      " 2>/dev/null || true
                    fi

                    # 2. Stop HADR on Primary, disable DB2COMM, and deactivate database so operator has exclusive access during rollout
                    echo "Stopping HADR and isolating Primary (c-${DB2_INSTANCE_NAME}-db2u-0)..."
                    oc exec -n "${DB2_NAMESPACE}" "c-${DB2_INSTANCE_NAME}-db2u-0" -- sv stop governor 2>/dev/null || true
                    oc exec -n "${DB2_NAMESPACE}" "c-${DB2_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "
                      db2 stop hadr on db ${DB_NAME} || true
                      db2set DB2COMM=''
                      db2 force application all
                      db2 terminate
                      db2 deactivate database ${DB_NAME} || true
                    " 2>/dev/null || true

                    # 3. Create upgrade state ConfigMap for PostSync jobs
                    echo "Recording upgrade state in ConfigMap ${UPGRADE_CM}..."
                    oc create configmap "${UPGRADE_CM}" -n "${DB2_NAMESPACE}" \
                      --from-literal=target_version="${TARGET_DB2_VERSION}" \
                      --from-literal=primary_upgraded="false" \
                      --from-literal=standby_upgraded="false" \
                      --from-literal=replica_db="${REPLICA_DB}" \
                      --dry-run=client -o yaml | oc apply -f -
                    echo "PreSync upgrade preparation completed successfully."
                  else
                    echo "Db2 version matches target (${TARGET_DB2_VERSION}). No upgrade preparation needed."
                  fi
                fi
              fi

              # If running for standby (sdb) during HADR upgrade, wait for primary database upgrade to complete
              if [[ "${DB2_INSTANCE_NAME}" == *"sdb"* ]] && [[ "${REPLICA_DB}" == "true" ]] && [[ "${TARGET_DB2_VERSION}" == "s12."* || "${TARGET_DB2_VERSION}" == "12."* ]]; then
                PRIMARY_DB2_INSTANCE_NAME=${DB2_INSTANCE_NAME:0:-4}
                UPGRADE_CM="hadr-upgrade-in-progress-${PRIMARY_DB2_INSTANCE_NAME}"

                if oc get db2uinstance "${DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                  CURRENT_VERSION=$(oc get db2uinstance "${DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.spec.version}')
                  if [[ -n "${CURRENT_VERSION}" ]] && [[ "${CURRENT_VERSION}" == "s11."* || "${CURRENT_VERSION}" == "11."* ]] && [[ "${TARGET_DB2_VERSION}" == "s12."* || "${TARGET_DB2_VERSION}" == "12."* ]]; then
                    echo "================================================================================"
                    echo "Standby HADR upgrade detected (Current=${CURRENT_VERSION}, Target=${TARGET_DB2_VERSION})."
                    echo "Waiting for Primary DB (${PRIMARY_DB2_INSTANCE_NAME}) upgrade to complete..."
                    echo "================================================================================"

                    # Isolate local standby database to prevent reconnection contention
                    DB_NAME="${DB2_DBNAME:-BLUDB}"
                    oc exec -n "${DB2_NAMESPACE}" "c-${DB2_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "
                      db2 stop hadr on db ${DB_NAME} || true
                      db2set DB2COMM=''
                      db2 force application all
                      db2 terminate
                      db2 deactivate database ${DB_NAME} || true
                    " 2>/dev/null || true

                    wait_count=0
                    while true; do
                      if oc get configmap "${UPGRADE_CM}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                        PRIMARY_UPGRADED=$(oc get configmap "${UPGRADE_CM}" -n "${DB2_NAMESPACE}" -o jsonpath='{.data.primary_upgraded}' 2>/dev/null || echo "false")
                        if [[ "${PRIMARY_UPGRADED}" == "true" ]]; then
                          PRIMARY_SPEC_VERSION=$(oc get db2uinstance "${PRIMARY_DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.spec.version}' 2>/dev/null || true)
                          PRIMARY_STATUS_VERSION=$(oc get db2uinstance "${PRIMARY_DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.status.version}' 2>/dev/null || true)
                          PRIMARY_STATUS_STATE=$(oc get db2uinstance "${PRIMARY_DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.status.state}' 2>/dev/null || true)
                          echo "Primary db2uinstance: spec.version=${PRIMARY_SPEC_VERSION}, status.version=${PRIMARY_STATUS_VERSION}, status.state=${PRIMARY_STATUS_STATE} (target=${TARGET_DB2_VERSION})"
                          if [[ "${PRIMARY_SPEC_VERSION}" == "${TARGET_DB2_VERSION}" && "${PRIMARY_SPEC_VERSION}" == "${PRIMARY_STATUS_VERSION}" && "${PRIMARY_STATUS_STATE}" == "Ready" ]]; then
                            echo "Primary database upgrade verified (primary_upgraded=true, version=${TARGET_DB2_VERSION}, versions in sync, state=Ready). Proceeding with Standby sync."
                            break
                          fi
                        fi
                      fi

                      # Also check if primary db2uinstance is already updated to target version with versions in sync and state Ready
                      if oc get db2uinstance "${PRIMARY_DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                        PRIMARY_SPEC_VERSION=$(oc get db2uinstance "${PRIMARY_DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.spec.version}' 2>/dev/null || true)
                        PRIMARY_STATUS_VERSION=$(oc get db2uinstance "${PRIMARY_DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.status.version}' 2>/dev/null || true)
                        PRIMARY_STATUS_STATE=$(oc get db2uinstance "${PRIMARY_DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.status.state}' 2>/dev/null || true)
                        if [[ "${PRIMARY_SPEC_VERSION}" == "${TARGET_DB2_VERSION}" && "${PRIMARY_SPEC_VERSION}" == "${PRIMARY_STATUS_VERSION}" && "${PRIMARY_STATUS_STATE}" == "Ready" ]] && ! oc get configmap "${UPGRADE_CM}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                          echo "Primary DB version is at target (${TARGET_DB2_VERSION}), versions in sync, state=Ready, and upgrade ConfigMap is cleared. Proceeding with Standby sync."
                          break
                        fi
                      fi

                      wait_count=$((wait_count+1))
                      if [ $wait_count -gt 180 ]; then
                        echo "ERROR: Timeout waiting for Primary database upgrade after 1800s (30m)."
                        exit 1
                      fi

                      echo "Waiting for Primary DB upgrade / ConfigMap ${UPGRADE_CM}... (${wait_count}/180 - $((wait_count*10))s elapsed)"
                      sleep 10
                    done

                    # Primary upgrade is complete. Before ArgoCD applies the new version to the
                    # standby db2uinstance CR, prepare the standby database:
                    #  - rollforward to end of logs (clears any pending log apply state)
                    #  - activate then deactivate cleanly so the operator starts from a clean state
                    echo ""
                    echo "================================================================================"
                    echo "Preparing standby database ${DB_NAME} before CR upgrade..."
                    echo "================================================================================"
                    oc exec -n "${DB2_NAMESPACE}" "c-${DB2_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "
                      db2start || true
                      db2 rollforward db ${DB_NAME} to end of logs and stop || true
                      db2 activate db ${DB_NAME} || true
                      db2 deactivate db ${DB_NAME} || true
                      db2stop force || true
                    " || true
                    echo "Standby database prepared for upgrade."
                  fi
                fi
              fi

      restartPolicy: Never

      # TODO: is this the correct SA to use here?
      # No, probably want to add a more restricted SA that can just do things that these post-sync jobs need to do
      serviceAccountName: "presync-sa-{{ .Values.db2_instance_name }}"
      volumes: []
  backoffLimit: 4
{{- end }}
