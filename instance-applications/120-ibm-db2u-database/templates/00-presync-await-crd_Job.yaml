{{- if .Values.application_admin_role }}
{{- /*
Use the build/bin/set-cli-image-digest.sh script to update this value across all charts.
*/}}
{{- $_cli_image_digest := "sha256:1dc8665fddb9546b84290b0615fc7c7017e19516082b35541d41b8ea82df347b" }}

---
# Service account that is authorized to read k8s secrets (needed by the job)
kind: ServiceAccount
apiVersion: v1
metadata:
  name: "presync-sa-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}


---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "db2-database-presync-sa-role-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
- apiGroups:
    - db2u.databases.ibm.com
  resources:
    - db2uinstances
  verbs:
    - get
    - list
    - patch
    - update
- apiGroups:
    - ""
  resources:
    - pods
  verbs:
    - get
    - list
- apiGroups:
    - ""
  resources:
    - pods/exec
  verbs:
    - create
    - get
    - list
- apiGroups:
    - ""
  resources:
    - configmaps
  verbs:
    - create
    - get
    - list
    - update
    - patch
    - delete



---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "db2-database-presync-sa-rb-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: "presync-sa-{{ .Values.db2_instance_name }}"
    namespace: "{{ .Values.db2_namespace }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "db2-database-presync-sa-role-{{ .Values.db2_instance_name }}"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: "presync-await-crd-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  template:
{{- if .Values.custom_labels }}
    metadata:
      labels:
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      containers:
        - name: run
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          env:
            - name: DB2_NAMESPACE
              value: "{{ .Values.db2_namespace }}"
            - name: DB2_INSTANCE_NAME
              value: "{{ .Values.db2_instance_name }}"
            - name: TARGET_DB2_VERSION
              value: "{{ .Values.db2_version }}"
            - name: REPLICA_DB
              value: "{{ .Values.replica_db | default false }}"
          volumeMounts: []
          command:
            - /bin/sh
            - -c
            - |

              set -e

              # Wait for DB2 CRD to be available by checking if we can query the resource
              wait_period=0
              echo "Waiting for DB2 CRD (db2uinstances) to be available..."
              
              while true
              do
                wait_period=$(($wait_period+10))
                if [ $wait_period -gt 300 ];then
                  echo "DB2 CRD db2uinstances is not ready within 300 seconds, exiting"
                  exit 1
                fi
                
                sleep 10
                
                if oc get db2uinstances -n "${DB2_NAMESPACE}" --no-headers 2>/dev/null; then
                  echo "DB2 CRD db2uinstances.db2u.databases.ibm.com is available"
                  break
                fi
                
                echo "DB2 CRD not yet available, waiting... (${wait_period}s elapsed)"
              done
              echo "DB2 CRD is ready"

              # Check if HADR Primary DB version upgrade is being initiated
              if [[ "${DB2_INSTANCE_NAME}" != *"sdb"* ]] && [[ -n "${TARGET_DB2_VERSION}" ]] && [[ "${REPLICA_DB}" == "true" ]]; then
                UPGRADE_CM="hadr-upgrade-in-progress-${DB2_INSTANCE_NAME}"

                if oc get db2uinstance "${DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                  CURRENT_VERSION=$(oc get db2uinstance "${DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.spec.version}')
                  echo "Checking Db2 version: Current=${CURRENT_VERSION}, Target=${TARGET_DB2_VERSION}"

                  if [[ -n "${CURRENT_VERSION}" ]] && [[ "${CURRENT_VERSION}" != "${TARGET_DB2_VERSION}" ]] && [[ "${TARGET_DB2_VERSION}" == "s12."* || "${TARGET_DB2_VERSION}" == "12."* ]]; then
                    echo "================================================================================"
                    echo "HADR Version drift detected. Initiating PreSync upgrade preparation..."
                    echo "================================================================================"

                    # 1. Stop HADR/governor on primary engine pod
                    echo "Stopping HADR and governor on Primary (c-${DB2_INSTANCE_NAME}-db2u-0)..."
                    oc exec -n "${DB2_NAMESPACE}" "c-${DB2_INSTANCE_NAME}-db2u-0" -- sv stop governor || true
                    oc exec -n "${DB2_NAMESPACE}" "c-${DB2_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "db2 stop hadr on db ${DB2_DBNAME} || true" || true

                    # 2. Process standby-specific steps
                    SDB_INSTANCE_NAME="${DB2_INSTANCE_NAME}-sdb"
                    if oc get db2uinstance "${SDB_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                      echo "Stopping HADR and governor on Standby (c-${SDB_INSTANCE_NAME}-db2u-0)..."
                      oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- sv stop governor || true
                      oc exec -n "${DB2_NAMESPACE}" "c-${SDB_INSTANCE_NAME}-db2u-0" -- su - db2inst1 -c "db2 stop hadr on db ${DB2_DBNAME} || true" || true

                      echo "Annotating Standby ${SDB_INSTANCE_NAME} with db2ckupgrade_hadr=initialize..."
                      oc annotate db2uinstance "${SDB_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" \
                        db2u.databases.ibm.com/db2ckupgrade_hadr=initialize --overwrite

                      echo "Waiting for Standby condition Db2CheckUpgradeHadrSuccess=True..."
                      check_count=0
                      until [ "$(oc get db2uinstance ${SDB_INSTANCE_NAME} -n ${DB2_NAMESPACE} -o jsonpath='{.status.conditions[?(@.type=="Db2CheckUpgradeHadrSuccess")].status}' 2>/dev/null)" == "True" ]; do
                        if [ "$(oc get db2uinstance ${SDB_INSTANCE_NAME} -n ${DB2_NAMESPACE} -o jsonpath='{.status.conditions[?(@.type=="Db2CheckUpgradeHadrFailure")].status}' 2>/dev/null)" == "True" ]; then
                          echo "ERROR: Standby upgrade check failed! Check \${SUPPORTDIR}/db2_upgrade_check.log on standby pod."
                          exit 1
                        fi
                        check_count=$((check_count+1))
                        if [ $check_count -gt 30 ]; then
                          echo "ERROR: Timeout waiting for Standby Db2CheckUpgradeHadrSuccess condition after 300s."
                          exit 1
                        fi
                        echo "... waiting for Db2CheckUpgradeHadrSuccess (attempt ${check_count}/30)..."
                        sleep 10
                      done
                      echo "Standby upgrade check succeeded."
                    fi

                    # 3. Create upgrade state ConfigMap for PostSync jobs
                    echo "Recording upgrade state in ConfigMap ${UPGRADE_CM}..."
                    oc create configmap "${UPGRADE_CM}" -n "${DB2_NAMESPACE}" \
                      --from-literal=target_version="${TARGET_DB2_VERSION}" \
                      --from-literal=primary_upgraded="false" \
                      --from-literal=standby_upgraded="false" \
                      --from-literal=replica_db="${REPLICA_DB}" \
                      --dry-run=client -o yaml | oc apply -f -
                    echo "PreSync upgrade preparation completed successfully."
                  else
                    echo "Db2 version matches target (${TARGET_DB2_VERSION}). No upgrade preparation needed."
                  fi
                fi
              fi

              # If running for standby (sdb) during HADR upgrade, wait for primary database upgrade to complete
              if [[ "${DB2_INSTANCE_NAME}" == *"sdb"* ]] && [[ "${REPLICA_DB}" == "true" ]] && [[ "${TARGET_DB2_VERSION}" == "s12."* || "${TARGET_DB2_VERSION}" == "12."* ]]; then
                PRIMARY_DB2_INSTANCE_NAME=${DB2_INSTANCE_NAME:0:-4}
                UPGRADE_CM="hadr-upgrade-in-progress-${PRIMARY_DB2_INSTANCE_NAME}"

                if oc get db2uinstance "${DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                  CURRENT_VERSION=$(oc get db2uinstance "${DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.spec.version}')
                  if [[ -n "${CURRENT_VERSION}" ]] && [[ "${CURRENT_VERSION}" == "s11."* || "${CURRENT_VERSION}" == "11."* ]] && [[ "${TARGET_DB2_VERSION}" == "s12."* || "${TARGET_DB2_VERSION}" == "12."* ]]; then
                    echo "================================================================================"
                    echo "Standby HADR upgrade detected (Current=${CURRENT_VERSION}, Target=${TARGET_DB2_VERSION})."
                    echo "Waiting for Primary DB (${PRIMARY_DB2_INSTANCE_NAME}) upgrade to complete..."
                    echo "================================================================================"

                    wait_count=0
                    while true; do
                      if oc get configmap "${UPGRADE_CM}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                        PRIMARY_UPGRADED=$(oc get configmap "${UPGRADE_CM}" -n "${DB2_NAMESPACE}" -o jsonpath='{.data.primary_upgraded}' 2>/dev/null || echo "false")
                        if [[ "${PRIMARY_UPGRADED}" == "true" ]]; then
                          echo "Primary database upgrade verified (primary_upgraded=true). Proceeding with Standby sync."
                          break
                        fi
                      fi

                      # Also check if primary db2uinstance is already updated to target version
                      if oc get db2uinstance "${PRIMARY_DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                        PRIMARY_VERSION=$(oc get db2uinstance "${PRIMARY_DB2_INSTANCE_NAME}" -n "${DB2_NAMESPACE}" -o jsonpath='{.spec.version}')
                        if [[ "${PRIMARY_VERSION}" == "${TARGET_DB2_VERSION}" ]] && ! oc get configmap "${UPGRADE_CM}" -n "${DB2_NAMESPACE}" >/dev/null 2>&1; then
                          echo "Primary DB version is already at target (${TARGET_DB2_VERSION}) and upgrade ConfigMap is cleared. Proceeding with Standby sync."
                          break
                        fi
                      fi

                      wait_count=$((wait_count+1))
                      if [ $wait_count -gt 180 ]; then
                        echo "ERROR: Timeout waiting for Primary database upgrade after 1800s (30m)."
                        exit 1
                      fi

                      echo "Waiting for Primary DB upgrade / ConfigMap ${UPGRADE_CM}... (${wait_count}/180 - $((wait_count*10))s elapsed)"
                      sleep 10
                    done
                  fi
                fi
              fi

      restartPolicy: Never

      # TODO: is this the correct SA to use here?
      # No, probably want to add a more restricted SA that can just do things that these post-sync jobs need to do
      serviceAccountName: "presync-sa-{{ .Values.db2_instance_name }}"
      volumes: []
  backoffLimit: 4
{{- end }}
