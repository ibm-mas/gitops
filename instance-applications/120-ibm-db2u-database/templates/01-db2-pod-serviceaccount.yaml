{{- if .Values.application_admin_role }}
---
# ServiceAccount for DB2 Pod
# This ServiceAccount is used by the DB2 pod itself (not the CronJob)
# IRSA annotation allows the DB2 pod to assume an IAM Role for S3 access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "db2u-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "120"
{{- if .Values.db2_audit_irsa_role_arn }}
    # IRSA: Associate this ServiceAccount with an IAM Role
    # The IAM Role must have a trust policy allowing this ServiceAccount
    # This enables the DB2 pod to access S3 without IAM User credentials
    eks.amazonaws.com/role-arn: "{{ .Values.db2_audit_irsa_role_arn }}"
{{- end }}
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
{{- end }}

