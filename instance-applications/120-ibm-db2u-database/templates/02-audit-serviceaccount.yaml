{{- if .Values.application_admin_role }}
{{- if and .Values.db2_backup_bucket_name (not (contains "sdb" .Values.db2_instance_name)) }}
---
# ServiceAccount for DB2 Audit Log Extraction CronJob
# Supports both IAM User credentials (legacy) and IRSA (recommended)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "account-{{ .Values.db2_namespace }}-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "125"
{{- if .Values.db2_audit_irsa_role_arn }}
    # IRSA: Associate this ServiceAccount with an IAM Role
    # The IAM Role must have a trust policy allowing this ServiceAccount
    eks.amazonaws.com/role-arn: "{{ .Values.db2_audit_irsa_role_arn }}"
{{- end }}
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}

---
# Role: Permissions for audit extraction CronJob
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "db2-audit-role-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "125"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
- apiGroups:
    - ""
  resources:
    - pods
  verbs:
    - get
    - list

- apiGroups:
    - ""
  resources:
    - pods/exec
  verbs:
    - create

---
# RoleBinding: Bind the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "db2-audit-rb-{{ .Values.db2_instance_name }}"
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "125"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: "account-{{ .Values.db2_namespace }}-{{ .Values.db2_instance_name }}"
    namespace: "{{ .Values.db2_namespace }}"
roleRef:
  kind: Role
  name: "db2-audit-role-{{ .Values.db2_instance_name }}"
  apiGroup: rbac.authorization.k8s.io

{{- end }}
{{- end }}

