{{- if .Values.application_admin_role }}
{{- /*
Audit policy setup job for DB2.
Runs per-application audit policy commands on the db2u pod after the main
postsync setup job (sync-wave 129) has completed.

Currently supported: manage
*/}}
{{- if .Values.should_execute }}

{{- if not (contains "sdb" .Values.db2_instance_name) }}

{{- $_job_name_prefix := "postsync-db2-audit-policy" }}

{{- /*
Use the build/bin/set-cli-image-digest.sh script to update this value across all charts.
*/}}
{{- $_cli_image_digest := "sha256:887cc3059a04601241687711df0c03d662931e6719121eec0eb0490001b2c8b9" }}

{{- $_job_config_values := omit .Values "junitreporter" }}

{{- /*
Increment this value whenever you make a change to an immutable field of the Job resource.
*/}}
{{- $_job_version := "v1" }}

{{- $_job_hash := print ($_job_config_values | toYaml) $_cli_image_digest $_job_version | adler32sum }}
{{- $_job_name := join "-" (list $_job_name_prefix $_job_hash) }}

{{- $_job_cleanup_group := cat $_job_name_prefix .Values.db2_instance_name | sha1sum }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $_job_name }}
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "130"
  labels:
    mas.ibm.com/job-cleanup-group: {{ $_job_cleanup_group }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  template:
{{- if .Values.custom_labels }}
    metadata:
      labels:
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      containers:
        - name: run
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent

          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi

          env:
            - name: MAS_APP_ID
              value: {{ .Values.mas_application_id }}
            - name: DB2_NAMESPACE
              value: "{{ .Values.db2_namespace }}"
            - name: DB2_INSTANCE_NAME
              value: "{{ .Values.db2_instance_name }}"
            - name: DB2_DBNAME
              value: "{{ .Values.db2_dbname }}"

          command:
            - /bin/sh
            - -c
            - |

              set -e

              DB2_POD="c-${DB2_INSTANCE_NAME}-db2u-0"

              # ============================================================
              # Audit policy: manage
              # ============================================================
              if [ "$MAS_APP_ID" = "manage" ]; then

                echo ""
                echo "================================================================================"
                echo "Setting up DB2 audit policy for Manage"
                echo "================================================================================"

                # ----------------------------------------------------------------
                # Connect to database
                # ----------------------------------------------------------------
                echo ""
                echo "Connecting to database ${DB2_DBNAME}"
                echo "--------------------------------------------------------------------------------"

                oc exec -n "${DB2_NAMESPACE}" "${DB2_POD}" -- \
                  su -lc "db2 connect to ${DB2_DBNAME}" db2inst1

                # ----------------------------------------------------------------
                # Create audit policy
                # ----------------------------------------------------------------
                echo ""
                echo "Creating audit policy USER_AUDIT"
                echo "--------------------------------------------------------------------------------"

                if oc exec -n "${DB2_NAMESPACE}" "${DB2_POD}" -- \
                  su -lc 'db2 "CREATE AUDIT POLICY USER_AUDIT CATEGORIES VALIDATE STATUS BOTH, EXECUTE WITHOUT DATA STATUS BOTH ERROR TYPE NORMAL"' db2inst1
                then
                  echo "Audit policy USER_AUDIT created successfully."
                else
                  echo "Audit policy USER_AUDIT may already exist. Continuing."
                fi

                # ----------------------------------------------------------------
                # Create MAXIMO_READ role
                # ----------------------------------------------------------------
                echo ""
                echo "Creating MAXIMO_READ role"
                echo "--------------------------------------------------------------------------------"

                if oc exec -n "${DB2_NAMESPACE}" "${DB2_POD}" -- \
                  su -lc 'db2 "CREATE ROLE MAXIMO_READ"' db2inst1
                then
                  echo "Role MAXIMO_READ created successfully."
                else
                  echo "Role MAXIMO_READ may already exist. Continuing."
                fi

                # ----------------------------------------------------------------
                # Create MAXIMO_WRITE role
                # ----------------------------------------------------------------
                echo ""
                echo "Creating MAXIMO_WRITE role"
                echo "--------------------------------------------------------------------------------"

                if oc exec -n "${DB2_NAMESPACE}" "${DB2_POD}" -- \
                  su -lc 'db2 "CREATE ROLE MAXIMO_WRITE"' db2inst1
                then
                  echo "Role MAXIMO_WRITE created successfully."
                else
                  echo "Role MAXIMO_WRITE may already exist. Continuing."
                fi

                # ----------------------------------------------------------------
                # Assign audit policy to MAXIMO_READ
                # ----------------------------------------------------------------
                echo ""
                echo "Applying USER_AUDIT to MAXIMO_READ"
                echo "--------------------------------------------------------------------------------"

                oc exec -n "${DB2_NAMESPACE}" "${DB2_POD}" -- \
                  su -lc 'db2 "AUDIT ROLE MAXIMO_READ USING POLICY USER_AUDIT"' db2inst1

                # ----------------------------------------------------------------
                # Assign audit policy to MAXIMO_WRITE
                # ----------------------------------------------------------------
                echo ""
                echo "Applying USER_AUDIT to MAXIMO_WRITE"
                echo "--------------------------------------------------------------------------------"

                oc exec -n "${DB2_NAMESPACE}" "${DB2_POD}" -- \
                  su -lc 'db2 "AUDIT ROLE MAXIMO_WRITE USING POLICY USER_AUDIT"' db2inst1

                # ----------------------------------------------------------------
                # Assign audit policy to db2inst1
                # ----------------------------------------------------------------
                echo ""
                echo "Applying USER_AUDIT to db2inst1"
                echo "--------------------------------------------------------------------------------"

                oc exec -n "${DB2_NAMESPACE}" "${DB2_POD}" -- \
                  su -lc 'db2 "AUDIT USER db2inst1 USING POLICY USER_AUDIT"' db2inst1

                # ----------------------------------------------------------------
                # Verify audit policy assignments
                # ----------------------------------------------------------------
                echo ""
                echo "================================================================================"
                echo "Verifying audit policy setup"
                echo "================================================================================"

                echo ""
                echo "Audit policy assignments:"
                echo "--------------------------------------------------------------------------------"

                oc exec -n "${DB2_NAMESPACE}" "${DB2_POD}" -- \
                  su -lc 'db2 "SELECT AUDITPOLICYNAME, OBJECTTYPE, OBJECTNAME FROM SYSCAT.AUDITUSE WHERE AUDITPOLICYNAME='\''USER_AUDIT'\''"' db2inst1

                echo ""
                echo "Audit policy configuration:"
                echo "--------------------------------------------------------------------------------"

                oc exec -n "${DB2_NAMESPACE}" "${DB2_POD}" -- \
                  su -lc 'db2 "SELECT AUDITPOLICYNAME, VALIDATESTATUS, EXECUTESTATUS, EXECUTEWITHDATA, ERRORTYPE FROM SYSCAT.AUDITPOLICIES WHERE AUDITPOLICYNAME='\''USER_AUDIT'\''"' db2inst1

                # ----------------------------------------------------------------
                # Disconnect
                # ----------------------------------------------------------------
                echo ""
                echo "Disconnecting from database"
                echo "--------------------------------------------------------------------------------"

                oc exec -n "${DB2_NAMESPACE}" "${DB2_POD}" -- \
                  su -lc "db2 connect reset" db2inst1

                echo ""
                echo "================================================================================"
                echo "DB2 audit policy setup completed successfully for Manage"
                echo "================================================================================"

              fi

      restartPolicy: Never
      serviceAccountName: "postsync-sa-{{ .Values.db2_instance_name }}"

  backoffLimit: 4

{{- end }}
{{- end }}
{{- end }}