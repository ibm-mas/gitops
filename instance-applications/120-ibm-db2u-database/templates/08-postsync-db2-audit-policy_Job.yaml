{{- if .Values.application_admin_role }}
{{- /*
Audit policy setup job for DB2.
Runs per-application audit policy commands on the db2u pod after the main
postsync setup job (sync-wave 129) has completed.

Only executed for applications that use DB2 audit policy:
  - manage    : AUDIT ROLE MAXIMO_READ, ROLE MAXIMO_WRITE USING POLICY USER_AUDIT
  - facilities: AUDIT ROLE TRIRIGA_READ, ROLE TRIRIGA_WRITE USING POLICY USER_AUDIT
  - monitor   : no role audit - db2inst1 user audit only
  - iot       : no role audit - db2inst1 user audit only

Common to all supported applications:
  - Create USER_AUDIT policy if not exists
  - AUDIT USER db2inst1 USING POLICY USER_AUDIT
*/}}
{{- $supported_apps := list "manage" "facilities" "monitor" "iot" }}
{{- if has .Values.mas_application_id $supported_apps }}
{{- if .Values.should_execute }}

{{- if not (contains "sdb" .Values.db2_instance_name) }}

{{- /*
Meaningful prefix for the job resource name. Must be under 52 chars in length to leave room for the 11 chars reserved for '-' and $_job_hash.
*/}}
{{- $_job_name_prefix := "postsync-audit-policy" }}

{{- /*
Use the build/bin/set-cli-image-digest.sh script to update this value across all charts.
Included in $_job_hash (see below).
*/}}
{{- $_cli_image_digest := "sha256:1c5701a24c9796e02b33036f56babbe74032831e1db733ce9228a46dce4a870b" }}

{{- /*
A dict of values that influence the behaviour of the job in some way.
Any changes to values in this dict will trigger a rerun of the job.
Included in $_job_hash (see below).
*/}}
{{- $_job_config_values := omit .Values "junitreporter" }}

{{- /*
Increment this value whenever you make a change to an immutable field of the Job resource.
E.g. passing in a new environment variable.
Included in $_job_hash (see below).
*/}}
{{- $_job_version := "v24" }}

{{- $_job_hash := print ($_job_config_values | toYaml) $_cli_image_digest $_job_version | adler32sum }}
{{- $_job_name := join "-" (list $_job_name_prefix $_job_hash) }}

{{- $_job_cleanup_group := cat $_job_name_prefix .Values.db2_instance_name | sha1sum }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $_job_name }}
  namespace: "{{ .Values.db2_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "130"
  labels:
    mas.ibm.com/job-cleanup-group: {{ $_job_cleanup_group }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  template:
{{- if .Values.custom_labels }}
    metadata:
      labels:
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      containers:
        - name: run
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          env:
            - name: DB2_NAMESPACE
              value: "{{ .Values.db2_namespace }}"
            - name: DB2_INSTANCE_NAME
              value: "{{ .Values.db2_instance_name }}"
            - name: DB2_DBNAME
              value: "{{ .Values.db2_dbname }}"
            - name: MAS_APP_ID
              value: "{{ .Values.mas_application_id }}"
          command:
            - /bin/sh
            - -c
            - |

              set -e

              DB2_POD="c-${DB2_INSTANCE_NAME}-db2u-0"

              echo ""
              echo "================================================================================"
              echo "                         DB2 AUDIT POLICY SETUP"
              echo "================================================================================"
              echo ""
              echo "Configuration"
              echo "--------------------------------------------------------------------------------"
              echo "DB2 Namespace        : ${DB2_NAMESPACE}"
              echo "DB2 Instance         : ${DB2_INSTANCE_NAME}"
              echo "Database             : ${DB2_DBNAME}"
              echo "MAS Application      : ${MAS_APP_ID}"

              # All DB2 commands run in a single oc exec so the database
              # connection established by 'db2 connect' is shared across
              # every subsequent statement in the same session.
              oc exec -n "${DB2_NAMESPACE}" "${DB2_POD}" -- su -lc "
                set -e

                echo ''
                echo '--------------------------------------------------------------------------------'
                echo '[1/4] Database Connection'
                echo '--------------------------------------------------------------------------------'
                echo \"Connecting to database '${DB2_DBNAME}'...\"

                if ! db2gcf -s | grep Available >/dev/null; then
                    db2_kill
                    ipclean -a
                    db2start
                    if ! db2gcf -s | grep Available >/dev/null; then
                        echo 'Instance is not up. Please check.'
                        exit 1
                    fi
                fi

                db2 connect to ${DB2_DBNAME}
                echo '[OK] Database connection successful.'

                echo ''
                echo '--------------------------------------------------------------------------------'
                echo '[2/4] USER_AUDIT Policy'
                echo '--------------------------------------------------------------------------------'
                echo \"Checking whether audit policy 'USER_AUDIT' exists...\"
                echo ''
                POLICY_EXISTS=\$(db2 -x \"SELECT COUNT(*) FROM SYSCAT.AUDITPOLICIES WHERE AUDITPOLICYNAME='USER_AUDIT'\" | tr -d ' ')
                if [ \"\$POLICY_EXISTS\" -eq \"0\" ]; then
                  echo \"[CREATE] USER_AUDIT policy does not exist - creating...\"
                  db2 \"CREATE AUDIT POLICY USER_AUDIT CATEGORIES VALIDATE STATUS BOTH, EXECUTE WITHOUT DATA STATUS BOTH ERROR TYPE NORMAL\"
                  echo '[OK] USER_AUDIT policy created.'
                else
                  echo '[SKIP] USER_AUDIT policy already exists.'
                  echo '       No changes required.'
                fi

                echo ''
                echo '--------------------------------------------------------------------------------'
                echo '[3/4] USER_AUDIT Role Assignments'
                echo '--------------------------------------------------------------------------------'
                echo 'Checking USER_AUDIT assignment to roles:'
                echo ''
                if [ \"${MAS_APP_ID}\" = \"manage\" ]; then
                  ROLE_READ_EXISTS=\$(db2 -x \"SELECT COUNT(*) FROM SYSCAT.ROLES WHERE ROLENAME='MAXIMO_READ'\" | tr -d ' ')
                  ROLE_WRITE_EXISTS=\$(db2 -x \"SELECT COUNT(*) FROM SYSCAT.ROLES WHERE ROLENAME='MAXIMO_WRITE'\" | tr -d ' ')
                  if [ \"\$ROLE_READ_EXISTS\" -gt \"0\" ] && [ \"\$ROLE_WRITE_EXISTS\" -gt \"0\" ]; then
                    echo '  - MAXIMO_READ'
                    db2 \"AUDIT ROLE MAXIMO_READ USING POLICY USER_AUDIT\" >/dev/null 2>&1 \
                      && echo '    [OK] USER_AUDIT assigned.' \
                      || echo '    [SKIP] Already assigned.'
                    echo '  - MAXIMO_WRITE'
                    db2 \"AUDIT ROLE MAXIMO_WRITE USING POLICY USER_AUDIT\" >/dev/null 2>&1 \
                      && echo '    [OK] USER_AUDIT assigned.' \
                      || echo '    [SKIP] Already assigned.'
                  else
                    echo '  [SKIP] MAXIMO_READ/MAXIMO_WRITE roles not found - skipping role audit.'
                  fi
                  ROLE_LABEL='MAXIMO_READ, MAXIMO_WRITE'
                elif [ \"${MAS_APP_ID}\" = \"facilities\" ]; then
                  ROLE_READ_EXISTS=\$(db2 -x \"SELECT COUNT(*) FROM SYSCAT.ROLES WHERE ROLENAME='TRIRIGA_READ'\" | tr -d ' ')
                  ROLE_WRITE_EXISTS=\$(db2 -x \"SELECT COUNT(*) FROM SYSCAT.ROLES WHERE ROLENAME='TRIRIGA_WRITE'\" | tr -d ' ')
                  if [ \"\$ROLE_READ_EXISTS\" -gt \"0\" ] && [ \"\$ROLE_WRITE_EXISTS\" -gt \"0\" ]; then
                    echo '  - TRIRIGA_READ'
                    db2 \"AUDIT ROLE TRIRIGA_READ USING POLICY USER_AUDIT\" >/dev/null 2>&1 \
                      && echo '    [OK] USER_AUDIT assigned.' \
                      || echo '    [SKIP] Already assigned.'
                    echo '  - TRIRIGA_WRITE'
                    db2 \"AUDIT ROLE TRIRIGA_WRITE USING POLICY USER_AUDIT\" >/dev/null 2>&1 \
                      && echo '    [OK] USER_AUDIT assigned.' \
                      || echo '    [SKIP] Already assigned.'
                  else
                    echo '  [SKIP] TRIRIGA_READ/TRIRIGA_WRITE roles not found - skipping role audit.'
                  fi
                  ROLE_LABEL='TRIRIGA_READ, TRIRIGA_WRITE'
                elif [ \"${MAS_APP_ID}\" = \"monitor\" ] || [ \"${MAS_APP_ID}\" = \"iot\" ]; then
                  ROLE_LABEL='N/A - user audit only'
                  echo '  [SKIP] No role audit required for ${MAS_APP_ID} - db2inst1 user audit only.'
                else
                  ROLE_LABEL='N/A'
                  echo '  [SKIP] No role audit configured for ${MAS_APP_ID}.'
                fi
                echo ''
                echo '[OK] USER_AUDIT role assignments verified.'

                echo ''
                echo '--------------------------------------------------------------------------------'
                echo '[4/4] USER_AUDIT User Assignment'
                echo '--------------------------------------------------------------------------------'
                echo 'Checking USER_AUDIT assignment to user:'
                echo ''
                echo '  - DB2INST1'
                db2 \"AUDIT USER db2inst1 USING POLICY USER_AUDIT\" >/dev/null 2>&1 \
                  && echo '    [OK] USER_AUDIT assigned.' \
                  || echo '    [SKIP] Already assigned.'
                echo ''
                echo '[OK] USER_AUDIT user assignment verified.'

                db2 connect reset

                echo ''
                echo '--------------------------------------------------------------------------------'
                echo '                         AUDIT CONFIGURATION SUMMARY'
                echo '--------------------------------------------------------------------------------'
                echo \"Audit Policy         : USER_AUDIT\"
                echo \"Roles                : \${ROLE_LABEL}\"
                echo \"User                 : DB2INST1\"
                echo ''
              " db2inst1 || exit $?

              echo ""
              echo "================================================================================"
              echo "                    DB2 AUDIT POLICY SETUP COMPLETE"
              echo "================================================================================"

      restartPolicy: Never
      serviceAccountName: "postsync-sa-{{ .Values.db2_instance_name }}"
  backoffLimit: 4

{{- end }}
{{- end }}
{{- end }}
{{- end }}
