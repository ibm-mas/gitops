---
instance_id: xxx
db2_instance_name: xxx
db2_namespace: xxxx
db2_instance_home_path: /mnt/blumeta0/home/db2inst1

# Number of days to retain audit log objects in S3 under Object Lock COMPLIANCE mode.
# Set to 0 to disable Object Lock entirely — required for dev/test environments
# where the S3 bucket does not have Object Lock enabled, or where a 365-day
# retention lock would prevent the bucket from being deprovisioned.
# Default: 365 (production compliance requirement).
# db2_audit_retention_days: 365

sm_aws_access_key_id: xxx
sm_aws_secret_access_key: xxxx

# Dedicated private NLB for Db2 access through AWS PrivateLink.
#
# When enabled, ROSA Classic provisions an internal AWS Network Load
# Balancer in the specified private-connectivity-edge subnets.
#
# The NLB is intended to be associated with an AWS PrivateLink
# VPC Endpoint Service managed separately from this Helm chart.
#
# Default: disabled — existing instances are unaffected.
private_nlb:
  enabled: false

  # private-connectivity-edge subnet IDs, typically one per AZ
  subnet_ids: []

  # Db2 TLS listener port
  port: 50001
  