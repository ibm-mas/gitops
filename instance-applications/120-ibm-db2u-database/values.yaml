---
instance_id: xxx
db2_instance_name: xxx
db2_namespace: xxxx
db2_instance_home_path: /mnt/blumeta0/home/db2inst1
facilities_db2_schema: "TRIDATA"

sm_aws_access_key_id: xxx
sm_aws_secret_access_key: xxxx

# Dedicated private NLB for Db2 access through AWS PrivateLink.
#
# When enabled, ROSA Classic provisions an internal AWS Network Load
# Balancer in the specified private-connectivity-edge subnets.
#
# The NLB is intended to be associated with an AWS PrivateLink
# VPC Endpoint Service managed separately from this Helm chart.
#
# Default: disabled — existing instances are unaffected.
private_nlb:
  enabled: false
  subnet_ids: []    # private-connectivity-edge subnet IDs, one per AZ
  allowed_cidrs: [] # customer CIDRs — restricts NLB access via loadBalancerSourceRanges
  port: 50001       # Db2 SSL port

# Custom hostname for the Db2 PrivateLink route.
# Overrides the generated route hostname (db2_instance_name-db2_namespace.cluster_domain).
# When empty, the existing generated hostname is used — no behavior change.
db2_route_hostname: ""

# Customer-supplied certificate for Db2 TLS (base64-encoded PEM data).
# Populated from the CLI-generated YAML fragment.
# When disabled, cert-manager/self-signed behavior is unchanged.
db2_manual_cert:
  enabled: false
  tls_crt: ""
  tls_key: ""
  ca_crt: ""
