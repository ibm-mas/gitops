{{- /*
IC_ROLE setup job for RDS DB2 (Manage only).

Only executed when ALL of the following conditions are met:
  1. production_database_access is set
  2. application_admin_role: true
  3. mas_application_id == "manage"

When the production-database-access GenericAddon is configured this job will:
  - Check if the IC_ROLE DB2 role already exists; create it via rdsadmin.create_role() if not.
  - Grant all required Maximo table, sequence, catalog, and package privileges
    to the IC_ROLE role (idempotent - safe to re-run).
*/}}
{{- if .Values.production_database_access }}
{{- if .Values.application_admin_role }}
{{- if eq .Values.mas_application_id "manage" }}

{{- $_job_name_prefix := "rds-postsync-ic-setup" }}

{{- /*
Use the build/bin/set-cli-image-digest.sh script to update this value across all charts.
Included in $_job_hash (see below).
*/}}
{{- $_cli_image_digest := "sha256:d9b9e5151413d08b79a45a0b657ecf48ae4eee30cb3bc997e6ccba1a8eb8f958" }}

{{- $_job_config_values := omit .Values "junitreporter" }}

{{- /*
Increment this value whenever you make a change to an immutable field of the Job resource.
*/}}
{{- $_job_version := "v2" }}

{{- $_job_hash := print ($_job_config_values | toYaml) $_cli_image_digest $_job_version | adler32sum }}
{{- $_job_name := join "-" (list $_job_name_prefix $_job_hash) }}
{{- $_job_cleanup_group := cat $_job_name_prefix .Values.db2_rds_instance_name | sha1sum }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.db2_rds_instance_name }}-rds-postsync-ic-setup
  annotations:
    argocd.argoproj.io/sync-wave: "137"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
data:
  rds-ic-role-setup.py: |
    import ibm_db as db2
    import os
    import sys
    import re

    DB_SCHEMA = "MAXIMO"
    IC_ROLE = "IC_ROLE"

    ssl_cert_path = os.environ.get("SSL_CERT_PATH", "/etc/mas/rds-ssl/global-bundle.pem")
    jdbc_connection_url = os.environ.get("JDBC_CONNECTION_URL", "")
    database_name = os.environ.get("DB_NAME", "")
    admin_db_name = os.environ.get("RDS_ADMIN_DB", "rdsadmin")

    with open("/etc/mas/dbs-rds-creds/username", 'r') as f:
        username = f.read().strip()

    with open("/etc/mas/dbs-rds-creds/password", 'r') as f:
        password = f.read().strip()

    # Extract SSL version from JDBC URL if provided
    ssl_version = 'TLSv1.2'
    if jdbc_connection_url:
        ssl_version_match = re.search(r'sslVersion=([^;]+)', jdbc_connection_url, re.IGNORECASE)
        if ssl_version_match:
            ssl_version = ssl_version_match.group(1)

    # Connection to rdsadmin DB (needed for rdsadmin.create_role procedure)
    conn_str_admin = (
        f"DATABASE={admin_db_name};"
        f"HOSTNAME={os.environ['DB_HOST']};"
        f"PORT={os.environ['DB_PORT']};"
        f"PROTOCOL=TCPIP;"
        f"UID={username};"
        f"PWD={password};"
        f"SECURITY=SSL;"
        f"SSLVersion={ssl_version};"
        f"SSLServerCertificate={ssl_cert_path};"
    )

    # Connection to target DB (needed for grants and verification)
    conn_str = (
        f"DATABASE={database_name};"
        f"HOSTNAME={os.environ['DB_HOST']};"
        f"PORT={os.environ['DB_PORT']};"
        f"PROTOCOL=TCPIP;"
        f"UID={username};"
        f"PWD={password};"
        f"SECURITY=SSL;"
        f"SSLVersion={ssl_version};"
        f"SSLServerCertificate={ssl_cert_path};"
    )

    print(f"Connecting to admin database: {admin_db_name}")
    try:
        conn_admin = db2.connect(conn_str_admin, "", "")
        print("Connected to admin database successfully")
    except Exception as e:
        print(f"Admin connection failed: {e}")
        sys.exit(1)

    print(f"Connecting to target database: {database_name}")
    try:
        conn = db2.connect(conn_str, "", "")
        print("Connected to target database successfully")
    except Exception as e:
        print(f"Target connection failed: {e}")
        db2.close(conn_admin)
        sys.exit(1)

    # Step 1: Check if IC_ROLE role exists; create via rdsadmin.create_role() if not
    print("== Step 1: Check role ==")
    try:
        stmt = db2.prepare(conn, "SELECT COUNT(*) FROM SYSCAT.ROLES WHERE ROLENAME = ?")
        db2.execute(stmt, (IC_ROLE,))
        result = db2.fetch_tuple(stmt)
        role_exists = int(result[0]) > 0
    except Exception as e:
        print(f"Error checking role: {e}")
        db2.close(conn)
        db2.close(conn_admin)
        sys.exit(1)

    if role_exists:
        print(f"Role {IC_ROLE} already exists - skipping creation.")
    else:
        print(f"Role {IC_ROLE} does not exist - creating via rdsadmin.create_role()...")
        try:
            db2.exec_immediate(conn_admin, "CALL DBMS_OUTPUT.ENABLE()")
            db2.exec_immediate(conn_admin, f"CALL rdsadmin.create_role('{database_name}', '{IC_ROLE}')")
            db2.exec_immediate(conn_admin, "CALL DBMS_OUTPUT.DISABLE()")
            print(f"Role {IC_ROLE} created successfully.")
        except Exception as e:
            error_msg = str(e)
            try:
                db2.exec_immediate(conn_admin, "CALL DBMS_OUTPUT.DISABLE()")
            except Exception:
                pass
            if "already exists" in error_msg.lower() or "SQL0601N" in error_msg:
                print(f"Role {IC_ROLE} already exists (detected during creation) - continuing.")
            else:
                print(f"Error creating role: {error_msg}")
                db2.close(conn)
                db2.close(conn_admin)
                sys.exit(1)

    # Step 2: Check if grants already applied
    print("== Step 2: Check grants ==")
    try:
        stmt = db2.prepare(conn,
            "SELECT COUNT(*) FROM SYSCAT.TABAUTH "
            "WHERE GRANTEE = ? AND GRANTEETYPE = 'R' AND TABSCHEMA = ? "
            "AND SELECTAUTH = 'Y' AND INSERTAUTH = 'Y' AND UPDATEAUTH = 'Y' AND DELETEAUTH = 'Y'")
        db2.execute(stmt, (IC_ROLE, DB_SCHEMA))
        result = db2.fetch_tuple(stmt)
        grants_count = int(result[0])
    except Exception as e:
        print(f"Error checking grants: {e}")
        db2.close(conn)
        sys.exit(1)

    if grants_count > 0:
        print(f"Grants already present ({grants_count} found) - skipping.")
    else:
        print("Grants not found - assigning all privileges...")
        errors = []

        # Static catalog/package/connect grants
        static_grants = [
            f"GRANT CONNECT ON DATABASE TO ROLE {IC_ROLE}",
            f"GRANT EXECUTE ON PROCEDURE SYSIBM.SQLCAMESSAGECCSID TO ROLE {IC_ROLE}",
            f"GRANT EXECUTE ON PACKAGE NULLID.SYSSH200 TO ROLE {IC_ROLE}",
            f"GRANT SELECT ON TABLE SYSIBM.SYSDUMMY1 TO ROLE {IC_ROLE}",
            f"GRANT SELECT ON TABLE SYSCAT.SCHEMATA TO ROLE {IC_ROLE}",
            f"GRANT SELECT ON TABLE SYSCAT.TABLES TO ROLE {IC_ROLE}",
            f"GRANT SELECT ON TABLE SYSCAT.COLUMNS TO ROLE {IC_ROLE}",
            f"GRANT SELECT ON TABLE SYSCAT.INDEXES TO ROLE {IC_ROLE}",
            f"GRANT SELECT ON TABLE SYSCAT.VIEWS TO ROLE {IC_ROLE}",
        ]

        for sql in static_grants:
            try:
                db2.exec_immediate(conn, sql)
                print(f"  OK: {sql}")
            except Exception as e:
                print(f"  WARN: {sql} -> {e}")
                errors.append(str(e))

        # Dynamic table grants - only for tables that exist in schema
        table_names = [
            'AUTOKEY','MAXSEQUENCE','SYNONYMDOMAIN','DEPLOYEDASSET','DPACCOMMDEVICE','DPACCPU',
            'DPACDISK','DPACDISPLAY','DPACIMAGEDEVICE','DPACMEDIAADAPTER','DPACNETADAPTER',
            'DPACNETDEVCARD','DPACOMMDEVICE','DPACOMPUTER','DPACOS','DPACPU','DPACSOFTWARE',
            'DPACSWSUITE','DPADISK','DPADISPLAY','DPAFILE','DPAIMAGEDEVICE','DPAIPX',
            'DPALOGICALDRIVE','DPAMADAPTER','DPAMADPTVARIANT','DPAMEDIAADAPTER','DPAMMANUFACTURER',
            'DPAMMANUVARIANT','DPAMOS','DPAMOSVARIANT','DPAMPROCESSOR','DPAMPROCVARIANT',
            'DPAMSOFTWARE','DPAMSWSUITE','DPAMSWSUITECOMP','DPAMSWUSAGE','DPAMSWUSAGERANGE',
            'DPAMSWVARIANT','DPANETADAPTER','DPANETDEVCARD','DPANETDEVICE','DPANETPRINTER',
            'DPAOS','DPASOFTWARE','DPASWSUITE','DPATCPIP','DPAUSERINFO','FSNCLASS','FSNCLASSQUAL',
            'FSNCLASSRELATION','FSNLASTSCAN','FSNMETHOD','FSNMETHODPARAM','FSNMTHDPARAMQUAL',
            'FSNMTHDQUAL','FSNOBJECT','FSNOBJPROPERTY','FSNOBJRELATION','FSNPROPERTY',
            'FSNPROPERTYQUAL','FSNPROVIDER','FSNQUALIFIER','FSNREFPROPERTY','FSNSCHEMA',
            'FSNSQLCOLUMN','FSNSQLTABLE','FSNTABLEQUAL','TAMITDPAHWM','TLOAMDPAANCESTOR',
            'TLOAMFSNEVENTLISTENER','TLOAMFSNRUNSTATUS','TLOAMSOFTWARE','ALIASES',
            'ATTRIBUTE_TYPES','CDM_VERSION','CHANGE_EVENTS','CLASS_TYPES','DESIRED_SUPPORTED_ATTRS',
            'DESIRED_SUPPORTED_MAP','ENUMERATIONS','INTERFACE_TYPES','ME_ATTRIBUTES','METADATA_ASSN',
            'MSS','MSS_ME','MSS_RELATIONSHIPS','NAMING_IDENTIFIERS','NAMING_POLICIES','NAMING_RULES',
            'RELATIONSHIP_TYPES','RELATIONSHIPS','SUPERIORS','VALID_REL_TYPES','ASSETATTRIBUTE',
            'CDMCITYPES','CLASSANCESTOR','CLASSIFICATION','CLASSSPEC','CLASSSTRUCTURE','RELATION',
            'RELATIONRULES','ACTCI','ACTCIRELATION','ACTCISPEC','CCIDELETEDACTCI','OMP','OMPCIRLN',
            'MAXVARS','MAXLABELS','L_MAXLABELS','MAXMESSAGES','TAMITSWPRTNUM','TLOAMSWCATALOG',
            'TLOAMSWREL'
        ]

        # Build IN clause placeholders
        placeholders = ','.join(['?' for _ in table_names])
        try:
            stmt = db2.prepare(conn,
                f"SELECT TABNAME FROM SYSCAT.TABLES WHERE TABSCHEMA = ? AND TABNAME IN ({placeholders})")
            db2.execute(stmt, tuple([DB_SCHEMA] + table_names))
            existing_tables = []
            row = db2.fetch_tuple(stmt)
            while row:
                existing_tables.append(row[0].strip())
                row = db2.fetch_tuple(stmt)
            print(f"  Found {len(existing_tables)} MAXIMO tables to grant")
        except Exception as e:
            print(f"  Error querying tables: {e}")
            existing_tables = []

        for tbl in existing_tables:
            try:
                db2.exec_immediate(conn, f'GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE {DB_SCHEMA}."{tbl}" TO ROLE {IC_ROLE}')
                print(f"  OK: GRANT on TABLE {tbl}")
            except Exception as e:
                print(f"  WARN: GRANT on TABLE {tbl} -> {e}")
                errors.append(str(e))

        # Dynamic sequence grants - only for sequences that exist in schema
        seq_names = [
            'ACTCIRELATIONSEQ','ACTCISEQ','ACTCISPECSEQ','ASSETATTRIBUTESEQ','AUTOKEYSEQ',
            'CCIDELETEDACTCISEQ','CDMCITYPESSEQ','CLASSANCESTORUSEQ','CLASSIFICATIONSEQ',
            'CLASSSPECSEQ','CLASSSTRUCTURESEQ','DEPLOYEDASSETSEQ','DPACOMMDEVICESEQ',
            'DPACOMPUTERSEQ','DPACPUSEQ','DPADISKSEQ','DPADISPLAYSEQ','DPAFILESEQ',
            'DPAIMAGEDEVICESEQ','DPAIPXSEQ','DPALOGICALDRIVESEQ','DPAMADAPTERSEQ',
            'DPAMADPTVARIANTSEQ','DPAMEDIAADAPTERSEQ','DPAMMANUFACTURERSEQ','DPAMMANUVARIANTSEQ',
            'DPAMOSSEQ','DPAMOSVARIANTSEQ','DPAMPROCESSORSEQ','DPAMPROCVARIANTSEQ',
            'DPAMSOFTWARESEQ','DPAMSWSUITECOMPSEQ','DPAMSWSUITESEQ','DPAMSWUSAGERANGESEQ',
            'DPAMSWUSAGESEQ','DPAMSWVARIANTSEQ','DPANETADAPTERSEQ','DPANETDEVCARDSEQ',
            'DPANETDEVICESEQ','DPANETPRINTERSEQ','DPAOSSEQ','DPASOFTWARESEQ','DPASWSUITESEQ',
            'DPATCPIPSEQ','DPAUSERINFOSEQ','L_MAXLABELSSEQ','MAXLABELSSEQ','MAXMESSAGESSEQ',
            'MAXSEQUENCESEQ','MAXVARSSEQ','OMPCIRLNSEQ','OMPSEQ','RELATIONRULESSEQ','RELATIONSEQ',
            'SYNONYMDOMAINSEQ','TAMITDPAHWMSEQ','TAMITSWPRTNUMSEQ','TLOAMDPAANCESTORSEQ',
            'TLOAMFSNEVENTLISTENERSEQ','TLOAMFSNRUNSTATUSSEQ','TLOAMSOFTWARESEQ',
            'TLOAMSWCATALOGSEQ','TLOAMSWRELSEQ'
        ]

        placeholders = ','.join(['?' for _ in seq_names])
        try:
            stmt = db2.prepare(conn,
                f"SELECT SEQNAME FROM SYSCAT.SEQUENCES WHERE SEQSCHEMA = ? AND SEQNAME IN ({placeholders})")
            db2.execute(stmt, tuple([DB_SCHEMA] + seq_names))
            existing_seqs = []
            row = db2.fetch_tuple(stmt)
            while row:
                existing_seqs.append(row[0].strip())
                row = db2.fetch_tuple(stmt)
            print(f"  Found {len(existing_seqs)} MAXIMO sequences to grant")
        except Exception as e:
            print(f"  Error querying sequences: {e}")
            existing_seqs = []

        for seq in existing_seqs:
            try:
                db2.exec_immediate(conn, f'GRANT USAGE, ALTER ON SEQUENCE {DB_SCHEMA}."{seq}" TO ROLE {IC_ROLE}')
                print(f"  OK: GRANT on SEQUENCE {seq}")
            except Exception as e:
                print(f"  WARN: GRANT on SEQUENCE {seq} -> {e}")
                errors.append(str(e))

        if errors:
            print(f"\nCompleted with {len(errors)} warning(s) - grants may have already existed.")
        else:
            print("\nAll grants applied successfully.")

    db2.close(conn_admin)

    # ── Step 3: Verification ────────────────────────────────────────────────
    print("== Step 3: Verification ==")
    verification_failed = False

    # 3a: Role exists
    print("\n-- 3a: Role exists (SYSCAT.ROLES) --")
    try:
        stmt = db2.prepare(conn,
            "SELECT ROLENAME, CREATE_TIME FROM SYSCAT.ROLES WHERE ROLENAME = ?")
        db2.execute(stmt, (IC_ROLE,))
        row = db2.fetch_tuple(stmt)
        if row:
            print(f"  ROLENAME={row[0].strip()}  CREATE_TIME={row[1]}")
        else:
            print(f"  ERROR: Role {IC_ROLE} not found in SYSCAT.ROLES")
            verification_failed = True
    except Exception as e:
        print(f"  ERROR: {e}")
        verification_failed = True

    # 3b: Total MAXIMO table grants count (must be non-zero)
    print("\n-- 3b: Total MAXIMO table grants (SELECT+INSERT+UPDATE+DELETE) --")
    try:
        stmt = db2.prepare(conn,
            "SELECT COUNT(*) FROM SYSCAT.TABAUTH "
            "WHERE GRANTEE = ? AND GRANTEETYPE = 'R' AND TABSCHEMA = ? "
            "AND SELECTAUTH = 'Y' AND INSERTAUTH = 'Y' AND UPDATEAUTH = 'Y' AND DELETEAUTH = 'Y'")
        db2.execute(stmt, (IC_ROLE, DB_SCHEMA))
        row = db2.fetch_tuple(stmt)
        count = int(row[0]) if row else 0
        print(f"  Count = {count}")
        if count == 0:
            print(f"  ERROR: No full table grants found for role {IC_ROLE} on schema {DB_SCHEMA}")
            verification_failed = True
    except Exception as e:
        print(f"  ERROR: {e}")
        verification_failed = True

    # 3c: List all MAXIMO table grants
    print("\n-- 3c: MAXIMO table grants detail --")
    try:
        stmt = db2.prepare(conn,
            "SELECT TABNAME, SELECTAUTH, INSERTAUTH, UPDATEAUTH, DELETEAUTH "
            "FROM SYSCAT.TABAUTH "
            "WHERE GRANTEE = ? AND GRANTEETYPE = 'R' AND TABSCHEMA = ? "
            "ORDER BY TABNAME")
        db2.execute(stmt, (IC_ROLE, DB_SCHEMA))
        rows = []
        row = db2.fetch_tuple(stmt)
        while row:
            rows.append(row)
            row = db2.fetch_tuple(stmt)
        print(f"  {len(rows)} table grant(s) found")
        for r in rows:
            print(f"  TABNAME={r[0].strip()}  SELECT={r[1]}  INSERT={r[2]}  UPDATE={r[3]}  DELETE={r[4]}")
    except Exception as e:
        print(f"  ERROR: {e}")
        verification_failed = True

    # 3d: Sequence grants
    print("\n-- 3d: Sequence grants (SYSCAT.SEQUENCEAUTH) --")
    try:
        stmt = db2.prepare(conn,
            "SELECT SEQNAME, USAGEAUTH, ALTERAUTH "
            "FROM SYSCAT.SEQUENCEAUTH "
            "WHERE GRANTEE = ? AND GRANTEETYPE = 'R' AND SEQSCHEMA = ? "
            "ORDER BY SEQNAME")
        db2.execute(stmt, (IC_ROLE, DB_SCHEMA))
        rows = []
        row = db2.fetch_tuple(stmt)
        while row:
            rows.append(row)
            row = db2.fetch_tuple(stmt)
        print(f"  {len(rows)} sequence grant(s) found")
        for r in rows:
            print(f"  SEQNAME={r[0].strip()}  USAGE={r[1]}  ALTER={r[2]}")
    except Exception as e:
        print(f"  ERROR: {e}")
        verification_failed = True

    # 3e: Catalog grants (SYSIBM / SYSCAT)
    print("\n-- 3e: Catalog grants (SYSIBM / SYSCAT) --")
    try:
        stmt = db2.prepare(conn,
            "SELECT TABSCHEMA, TABNAME, SELECTAUTH "
            "FROM SYSCAT.TABAUTH "
            "WHERE GRANTEE = ? AND GRANTEETYPE = 'R' AND TABSCHEMA IN ('SYSIBM', 'SYSCAT') "
            "ORDER BY TABSCHEMA, TABNAME")
        db2.execute(stmt, (IC_ROLE,))
        rows = []
        row = db2.fetch_tuple(stmt)
        while row:
            rows.append(row)
            row = db2.fetch_tuple(stmt)
        print(f"  {len(rows)} catalog grant(s) found")
        for r in rows:
            print(f"  TABSCHEMA={r[0].strip()}  TABNAME={r[1].strip()}  SELECT={r[2]}")
    except Exception as e:
        print(f"  ERROR: {e}")
        verification_failed = True

    # 3f: Package grant
    print("\n-- 3f: Package grant (SYSCAT.PACKAGEAUTH) --")
    try:
        stmt = db2.prepare(conn,
            "SELECT PKGSCHEMA, PKGNAME, EXECUTEAUTH "
            "FROM SYSCAT.PACKAGEAUTH "
            "WHERE GRANTEE = ? AND GRANTEETYPE = 'R'")
        db2.execute(stmt, (IC_ROLE,))
        rows = []
        row = db2.fetch_tuple(stmt)
        while row:
            rows.append(row)
            row = db2.fetch_tuple(stmt)
        print(f"  {len(rows)} package grant(s) found")
        for r in rows:
            print(f"  PKGSCHEMA={r[0].strip()}  PKGNAME={r[1].strip()}  EXECUTE={r[2]}")
    except Exception as e:
        print(f"  ERROR: {e}")
        verification_failed = True

    # 3g: CONNECT on database
    print("\n-- 3g: CONNECT on database (SYSCAT.DBAUTH) --")
    try:
        stmt = db2.prepare(conn,
            "SELECT GRANTEE, CONNECTAUTH "
            "FROM SYSCAT.DBAUTH "
            "WHERE GRANTEE = ? AND GRANTEETYPE = 'R'")
        db2.execute(stmt, (IC_ROLE,))
        row = db2.fetch_tuple(stmt)
        if row:
            print(f"  GRANTEE={row[0].strip()}  CONNECTAUTH={row[1]}")
        else:
            print(f"  ERROR: No CONNECT privilege found for role {IC_ROLE}")
            verification_failed = True
    except Exception as e:
        print(f"  ERROR: {e}")
        verification_failed = True

    print("\n== Step 3: Verification complete ==")
    db2.close(conn)
    if verification_failed:
        print("IC_ROLE setup completed WITH verification errors - review output above.")
        sys.exit(1)
    print("IC_ROLE setup completed successfully.")

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $_job_name }}
  annotations:
    argocd.argoproj.io/sync-wave: "138"
  labels:
    mas.ibm.com/job-cleanup-group: {{ $_job_cleanup_group }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  backoffLimit: 4
  template:
{{- if .Values.custom_labels }}
    metadata:
      labels:
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      containers:
        - name: run
          image: quay.io/ibmmas/cli@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              echo ""
              echo "================================================================================"
              echo "Settings"
              echo "================================================================================"
              echo "DB_HOST ...................... ${DB_HOST}"
              echo "DB_PORT ...................... ${DB_PORT}"
              echo "DB_NAME ...................... ${DB_NAME}"
              echo "MAS_APP_ID ................... ${MAS_APP_ID}"

              echo ""
              echo "================================================================================"
              echo "Downloading RDS SSL certificate"
              echo "================================================================================"
              mkdir -p /etc/mas/rds-ssl
              curl -sSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o /etc/mas/rds-ssl/global-bundle.pem
              echo "Certificate downloaded"

              echo ""
              echo "================================================================================"
              echo "Running IC user role setup"
              echo "================================================================================"
              python /etc/mas/rds-ic-role-script/rds-ic-role-setup.py

          env:
            - name: MAS_APP_ID
              value: {{ .Values.mas_application_id | quote }}
            - name: DB_HOST
              value: {{ .Values.host | quote }}
            - name: DB_PORT
              value: {{ .Values.port | quote }}
            - name: DB_NAME
              value: {{ .Values.dbname | default "" | quote }}
            - name: RDS_ADMIN_DB
              value: {{ .Values.rds_admin_db_name | quote }}
            - name: JDBC_CONNECTION_URL
              value: {{ .Values.jdbc_connection_url | quote }}
            - name: SSL_CERT_PATH
              value: "/etc/mas/rds-ssl/global-bundle.pem"
          volumeMounts:
            - name: dbs-rds-secret-store
              mountPath: /etc/mas/dbs-rds-creds/
            - name: rds-ic-role-script
              mountPath: /etc/mas/rds-ic-role-script/
      restartPolicy: Never
      volumes:
        - name: dbs-rds-secret-store
          secret:
            secretName: {{ .Values.db2_rds_instance_name }}-secret-store
            defaultMode: 420
            optional: false
        - name: rds-ic-role-script
          configMap:
            name: {{ .Values.db2_rds_instance_name }}-rds-ic-role-script

{{- end }}
{{- end }}
{{- end }}
