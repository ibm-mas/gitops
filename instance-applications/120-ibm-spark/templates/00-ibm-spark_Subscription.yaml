{{- if lt (semver "5.3.1" | (semver (.Values.cpd_product_version | default "0.0.0" | toString)).Compare) 0 }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: "ibm-cpd-ae-operator"
  namespace: "{{ .Values.cpd_operators_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "091"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  name: "analyticsengine-operator"
  channel: "{{ .Values.spark_channel }}"
  source: ibm-operator-catalog
  sourceNamespace: openshift-marketplace
  installPlanApproval: {{ .Values.spark_install_plan | default "Automatic" | quote }}
{{- end }}
