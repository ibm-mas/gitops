{{- if lt (semver "5.3.1" | (semver (.Values.cpd_product_version | toString)).Compare) 0 }}
---
apiVersion: spssmodeler.cpd.ibm.com/v1
kind: Spss
metadata:
  name: "spss-sample"
  namespace: "{{ .Values.cpd_instance_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "092"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  imagePullSecret: ibm-entitlement-key
  ignoreForMaintenance: false
  license:
    accept: true
    license: Standard
  scaleConfig: "{{ .Values.cpd_service_scale_config }}"
  fileStorageClass: "{{ .Values.cpd_service_storage_class }}"
  blockStorageClass: "{{ .Values.cpd_service_block_storage_class }}"
  version: "{{ .Values.spss_version }}"
  ccs_operand_version: "{{ .Values.ccs_version }}"
  datarefinery_operand_version: "{{ .Values.datarefinery_version }}"
  wsrt_operand_version: "{{ .Values.ws_runtimes_version }}"
{{- else }}
---
# Helm-based installation for CPD 5.3.1+
apiVersion: batch/v1
kind: Job
metadata:
  name: install-spss-helm
  namespace: "{{ .Values.cpd_operators_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "092"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
        - name: helm-install
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@sha256:887cc3059a04601241687711df0c03d662931e6719121eec0eb0490001b2c8b9
          command:
            - /bin/sh
            - -c
            - |
              set -e
              helm repo add ibm-charts https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm
              helm repo update

              echo "Installing spss-modeler cluster-scoped chart (CRDs + ClusterRoles)..."
              helm template spss-modeler-cluster ibm-charts/spss-modeler-cluster-scoped \
                --version 12.1.0 \
                --namespace {{ .Values.cpd_operators_namespace }} \
                --set global.licenseAccept=true \
                --set global.releaseVersion={{ .Values.cpd_product_version }} \
                --set global.operatorNamespace={{ .Values.cpd_operators_namespace }} \
                --set global.instanceNamespace={{ .Values.cpd_instance_namespace }} \
                --set global.imagePullSecret=ibm-entitlement-key | oc apply -f -

              echo "Waiting for spssmodelers.spssmodeler.cpd.ibm.com CRD to be established..."
              wait_period=0
              while true; do
                wait_period=$((wait_period+10))
                if [ $wait_period -gt 300 ]; then
                  echo "CRD not established after 5 minutes. Exiting."
                  exit 1
                fi
                STATUS=$(oc get crd spssmodelers.spssmodeler.cpd.ibm.com -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' --ignore-not-found 2>/dev/null)
                if [ "$STATUS" = "True" ]; then
                  echo "CRD established."
                  break
                fi
                sleep 10
              done

              echo "Installing spss-modeler namespace-scoped chart (operator + CR)..."
              helm upgrade --install spss-modeler ibm-charts/spss-modeler \
                --version 12.1.0 \
                --namespace {{ .Values.cpd_instance_namespace }} \
                --create-namespace \
                --set global.licenseAccept=true \
                --set global.releaseVersion={{ .Values.cpd_product_version }} \
                --set global.operatorNamespace={{ .Values.cpd_operators_namespace }} \
                --set global.instanceNamespace={{ .Values.cpd_instance_namespace }} \
                --set global.fileStorageClass={{ .Values.cpd_service_storage_class }} \
                --set global.blockStorageClass={{ .Values.cpd_service_block_storage_class }} \
                --set global.imagePullSecret=ibm-entitlement-key \
                --set spssmodeler.scaleConfig={{ .Values.cpd_service_scale_config }} \
                --wait --timeout 60m
      restartPolicy: Never
      serviceAccountName: cpd-sa
  backoffLimit: 2
{{- end }}
