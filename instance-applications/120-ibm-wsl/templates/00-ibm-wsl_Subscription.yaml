# ---
# apiVersion: operators.coreos.com/v1alpha1
# kind: Subscription
# metadata:
#   name: ibm-cpd-ws-operator
#   namespace: "{{ .Values.cpd_operators_namespace }}"
#   annotations:
#     argocd.argoproj.io/sync-wave: "090"
# {{- if .Values.custom_labels }}
#   labels:
# {{ .Values.custom_labels | toYaml | indent 4 }}
# {{- end }}
# spec:
#   name: ibm-cpd-wsl
#   channel: "{{ .Values.wsl_channel }}"
#   source: ibm-operator-catalog
#   sourceNamespace: openshift-marketplace
#   installPlanApproval: {{ .Values.wsl_install_plan | default "Automatic" | quote }}


{{- if lt (semver "5.3.1" | (semver (.Values.cpd_product_version | toString)).Compare) 0 }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ibm-cpd-ws-operator
  namespace: "{{ .Values.cpd_operators_namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "090"
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  name: ibm-cpd-wsl
  channel: "{{ .Values.wsl_channel }}"
  source: ibm-operator-catalog
  sourceNamespace: openshift-marketplace
  installPlanApproval: {{ .Values.wsl_install_plan | default "Automatic" | quote }}
{{- end }}