{{- /*
Meaningful prefix for the job resource name. Must be under 52 chars in length to leave room for the 11 chars reserved for '-' and $_job_hash.
*/}}
{{- $_job_name_prefix := "postdelete-suite-wait-configs" }}

{{- /*
Use the build/bin/set-cli-image-digest.sh script to update this value across all charts.
Included in $_job_hash (see below).
*/}}
{{- $_cli_image_digest := "sha256:b6df7b173b131d7340087a1a5d7ed51ff16cef7fcac7291a269b2ad1937a61af" }}

{{- /*
A dict of values that influence the behaviour of the job in some way.
Any changes to values in this dict will trigger a rerun of the job.
Included in $_job_hash (see below).
*/}}
{{- $_job_config_values := omit .Values "junitreporter" }}

{{- /*
Increment this value whenever you make a change to an immutable field of the Job resource.
E.g. passing in a new environment variable.
Included in $_job_hash (see below).
*/}}
{{- $_job_version := "v3" }}

{{- /*
10 char hash appended to the job name taking into account $_job_config_values, $_job_version and $_cli_image_digest.
*/}}
{{- $_job_hash := print ($_job_config_values | toYaml) $_cli_image_digest $_job_version | adler32sum }}

{{- $_job_name := join "-" (list $_job_name_prefix $_job_hash )}}

{{- /*
The SA, ClusterRole and ClusterRoleBinding below are intentionally NOT annotated as hooks.
They are regular managed resources so ArgoCD creates them on sync and they remain available
when the PostDelete hook job needs to run (hooks run after managed resources are deleted,
but these live in argo_namespace which ArgoCD doesn't clean up as part of the suite app).

All resources run in argo_namespace (the ArgoCD namespace), NOT in mas-<instance>-core,
so they never appear as drift to the suite Application's selfHeal controller.
*/}}

{{ $job_label := "postdelete-suite-wait-configs" }}
{{ $sa_name   := printf "postdelete-suite-wait-sa-%s"  .Values.instance_id }}
{{ $cr_name   := printf "postdelete-suite-wait-cr-%s"  .Values.instance_id }}
{{ $crb_name  := printf "postdelete-suite-wait-crb-%s" .Values.instance_id }}
{{ $argo_ns   := .Values.argo_namespace | default "openshift-gitops" }}

{{- if .Values.application_admin_role }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa_name }}
  namespace: {{ $argo_ns }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $cr_name }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - verbs:
      - get
      - list
    apiGroups:
      - "config.mas.ibm.com"
    resources:
      - appcfgs
      - bascfgs
      - idpcfgs
      - jdbccfgs
      - kafkacfgs
      - mongocfgs
      - objectstoragecfgs
      - slscfgs
      - smtpcfgs
      - watsonstudiocfgs
  - verbs:
      - get
      - list
    apiGroups:
      - "addons.mas.ibm.com"
    resources:
      - genericaddons
  - verbs:
      - get
      - patch
      - delete
    apiGroups:
      - "core.mas.ibm.com"
    resources:
      - suites

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $crb_name }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa_name }}
    namespace: {{ $argo_ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $cr_name }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $_job_name }}
  namespace: {{ $argo_ns }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  template:
    metadata:
      labels:
        app: {{ $job_label }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ $sa_name }}
      restartPolicy: Never
      containers:
        - name: run
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          env:
            - name: SUITE_NAMESPACE
              value: mas-{{ .Values.instance_id }}-core
            - name: INSTANCE_ID
              value: {{ .Values.instance_id }}
          command:
            - /bin/sh
            - -c
            - |

              set -e
              echo
              echo "================================================================================"
              echo "PostDelete phase 1: wait for all suite config CRs to be deleted"
              echo "================================================================================"
              echo
              echo "Suite namespace : ${SUITE_NAMESPACE}"
              echo "Instance ID     : ${INSTANCE_ID}"
              echo

              # All config CR types that can exist in mas-<instance>-core.
              CONFIG_RESOURCES="appcfgs.config.mas.ibm.com \
                                bascfgs.config.mas.ibm.com \
                                idpcfgs.config.mas.ibm.com \
                                jdbccfgs.config.mas.ibm.com \
                                kafkacfgs.config.mas.ibm.com \
                                mongocfgs.config.mas.ibm.com \
                                objectstoragecfgs.config.mas.ibm.com \
                                slscfgs.config.mas.ibm.com \
                                smtpcfgs.config.mas.ibm.com \
                                watsonstudiocfgs.config.mas.ibm.com \
                                genericaddons.addons.mas.ibm.com"

              wait_period=0
              while true; do
                REMAINING=0
                for resource in ${CONFIG_RESOURCES}; do
                  set +e
                  COUNT=$(oc get "${resource}" \
                    -n "${SUITE_NAMESPACE}" \
                    --no-headers 2>/dev/null \
                    | grep -v "^$" | wc -l)
                  set -e
                  REMAINING=$(( REMAINING + COUNT ))
                done

                echo "Config CRs still present in ${SUITE_NAMESPACE}: ${REMAINING}"

                if [ "${REMAINING}" -eq "0" ]; then
                  echo "All config CRs are gone. Moving to phase 2."
                  break
                fi

                wait_period=$(( wait_period + 30 ))
                if [ "${wait_period}" -gt 3600 ]; then
                  echo "Timed out after 60 minutes waiting for config CRs to be deleted."
                  exit 1
                fi

                echo "Waiting 30 seconds before next check..."
                sleep 30
              done

              echo
              echo "================================================================================"
              echo "PostDelete phase 2: delete Suite CR ${INSTANCE_ID}"
              echo "================================================================================"
              echo

              set +e
              SUITE_EXISTS=$(oc get suite.core.mas.ibm.com "${INSTANCE_ID}" \
                -n "${SUITE_NAMESPACE}" \
                --no-headers 2>/dev/null | grep -v "^$" | wc -l)
              set -e

              if [ "${SUITE_EXISTS}" -eq "0" ]; then
                echo "Suite CR '${INSTANCE_ID}' not found — nothing to delete."
                exit 0
              fi

              echo "Deleting Suite CR '${INSTANCE_ID}'..."
              oc delete suite.core.mas.ibm.com "${INSTANCE_ID}" \
                -n "${SUITE_NAMESPACE}" \
                --wait=true
              echo "Suite CR '${INSTANCE_ID}' deleted successfully."
  backoffLimit: 2

{{- end }}
