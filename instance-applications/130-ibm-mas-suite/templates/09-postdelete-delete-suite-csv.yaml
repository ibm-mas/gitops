{{- if .Values.application_admin_role }}
{{- if .Values.use_postdelete_hooks }}

{{- /*
PostDelete job: deletes the ibm-mas-operator Subscription and CSV from the core
namespace after the ArgoCD Application is removed, so OLM does not keep the Suite
operator running and the namespace can terminate cleanly.
Depends on SA/Role/RoleBinding in 01-postdelete-crs-resources.yaml.
Use build/bin/set-cli-image-digest.sh to update the image digest below.
*/}}
{{- $_cli_image_digest := "sha256:020f1925421de13beaf439aa09181209875ed3791824bcaaf1daaf910c725266" }}

{{- $core_ns   := printf "mas-%s-core" .Values.instance_id }}
{{- $name_hash := $core_ns | sha256sum | trunc 6 }}
{{- $job_name  := printf "postdelete-suite-csv-%s" $name_hash }}

{{ $sa_name   := "postdelete-delete-cr-sa" }}
{{ $job_label := "postdelete-delete-cr-job" }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job_name }}
  namespace: {{ $core_ns }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  template:
    metadata:
      labels:
        app: {{ $job_label }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ $sa_name }}
      restartPolicy: Never
      containers:
        - name: run
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          env:
            - name: CORE_NAMESPACE
              value: {{ $core_ns }}
          volumeMounts: []
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "------------------------------------------------------------------"
              echo "PostDelete: delete ibm-mas-operator Subscription in ${CORE_NAMESPACE}"
              set +e
              SUB_NAME=$(oc get subscription -n ${CORE_NAMESPACE} \
                --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null \
                | grep "^ibm-mas-operator$")
              set -e
              if [[ -z "${SUB_NAME}" ]]; then
                echo "No ibm-mas-operator Subscription found - skipping"
              else
                echo "Deleting Subscription: ${SUB_NAME}"
                oc delete subscription "${SUB_NAME}" -n ${CORE_NAMESPACE} \
                  --timeout=60s --wait=true 2>/dev/null || true
                echo "Subscription deleted"
              fi

              echo "------------------------------------------------------------------"
              echo "PostDelete: delete ibm-mas CSV in ${CORE_NAMESPACE}"
              set +e
              CSV_NAME=$(oc get csv -n ${CORE_NAMESPACE} \
                --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null \
                | grep "^ibm-mas\.")
              set -e
              if [[ -z "${CSV_NAME}" ]]; then
                echo "No ibm-mas CSV found - skipping"
              else
                echo "Deleting CSV: ${CSV_NAME}"
                oc delete csv "${CSV_NAME}" -n ${CORE_NAMESPACE} \
                  --timeout=60s --wait=true 2>/dev/null || true
                echo "CSV deleted"
              fi

              echo "PostDelete: Suite OLM cleanup complete"
      volumes: []
  backoffLimit: 4
{{- end }}
{{- end }}
