{{- if .Values.application_admin_role }}
{{- if .Values.use_postdelete_hooks }}

{{- /*
PostDelete job: force-deletes the MAS App CR (e.g. VisualInspectionApp, ManageApp, etc.)
after the ArgoCD Application is removed. Patches out operator-owned finalizers first so
deletion succeeds even if the app operator namespace is already gone.

Depends on SA/Role/NetworkPolicy created by ibm-mas-suite chart (01-postdelete-crs-resources.yaml).

Use the build/bin/set-cli-image-digest.sh script to update the image digest below.
*/}}
{{- $_cli_image_digest := "sha256:887cc3059a04601241687711df0c03d662931e6719121eec0eb0490001b2c8b9" }}

{{- $core_ns  := printf "mas-%s-core" .Values.instance_id }}
{{- $app_ns   := .Values.mas_app_namespace }}
{{- $cr_name  := .Values.instance_id }}
{{- $cr_kind  := .Values.mas_app_kind }}
{{- $cr_api_v := .Values.mas_app_api_version }}
{{- $name_hash := $cr_name | sha256sum | trunc 6 }}
{{- $job_name  := printf "postdelete-cr-job-app-%s-%s" ($cr_name | trunc 32) $name_hash }}

{{ $sa_name   := "postdelete-delete-cr-sa" }}
{{ $job_label := "postdelete-delete-cr-job" }}
{{ $appns_role_name := "postdelete-delete-appws-cr-r" }}
{{ $appns_rb_name   := "postdelete-delete-appws-cr-rb" }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job_name }}
  namespace: {{ $core_ns }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  template:
    metadata:
      labels:
        app: {{ $job_label }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ $sa_name }}
      restartPolicy: Never
      containers:
        - name: run
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          env:
            - name: CR_NAMESPACE
              value: {{ $app_ns }}
            - name: CR_NAME
              value: {{ $cr_name }}
            - name: CR_API_VERSION
              value: {{ $cr_api_v }}
            - name: CR_KIND
              value: {{ $cr_kind }}
            - name: MAS_APP_ID
              value: "{{ .Values.mas_app_id }}"
            - name: APPNS_ROLE_NAME
              value: {{ $appns_role_name }}
            - name: APPNS_RB_NAME
              value: {{ $appns_rb_name }}
          volumeMounts: []
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "------------------------------------------------------------------"
              echo "PostDelete: ${CR_KIND}.${CR_API_VERSION}/${CR_NAME} in ${CR_NAMESPACE}"

              set +e
              RESOURCE_NAME=$(oc get ${CR_KIND}.${CR_API_VERSION}/${CR_NAME} \
                -n ${CR_NAMESPACE} -o=jsonpath="{.metadata.name}" 2>/dev/null)
              set -e

              if [[ -n "${RESOURCE_NAME}" ]]; then
                # CR still exists - patch out finalizers first so delete succeeds
                # even if the operator is already gone, then delete the CR before
                # the CSV (killing CSV/operator while CR has finalizers = stuck Terminating)
                echo "Patching out finalizers..."
                set +e
                oc patch ${CR_KIND}.${CR_API_VERSION}/${CR_NAME} -n ${CR_NAMESPACE} \
                  --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null
                set -e

                echo "Deleting resource..."
                set +e
                oc delete ${CR_KIND}.${CR_API_VERSION}/${CR_NAME} \
                  -n ${CR_NAMESPACE} --timeout=120s --wait=true 2>/dev/null
                set -e

                # Verify gone
                set +e
                RESOURCE_NAME=$(oc get ${CR_KIND}.${CR_API_VERSION}/${CR_NAME} \
                  -n ${CR_NAMESPACE} -o=jsonpath="{.metadata.name}" 2>/dev/null)
                set -e

                if [[ -n "${RESOURCE_NAME}" ]]; then
                  echo "ERROR: resource still present after delete"
                  exit 1
                fi
              else
                echo "App CR not found - already removed by operator"
              fi

              # Delete Subscription - stops OLM from re-installing the operator.
              # Must happen after CR deletion so the operator is still alive to
              # process its finalizer, and before CSV deletion so OLM can react.
              echo "------------------------------------------------------------------"
              echo "PostDelete: delete ibm-mas-${MAS_APP_ID} Subscription in ${CR_NAMESPACE}"
              set +e
              SUB_NAME=$(oc get subscription -n ${CR_NAMESPACE} \
                --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null \
                | grep "^ibm-mas-${MAS_APP_ID}$")
              set -e
              if [[ -z "${SUB_NAME}" ]]; then
                echo "No ibm-mas-${MAS_APP_ID} Subscription found - skipping"
              else
                echo "Deleting Subscription: ${SUB_NAME}"
                oc delete subscription "${SUB_NAME}" -n ${CR_NAMESPACE} \
                  --timeout=60s --wait=true 2>/dev/null || true
                echo "Subscription deleted"
              fi

              # Always delete the CSV - OLM does not cascade-delete it when the
              # Subscription is removed, so the operator pod would otherwise remain
              # running and prevent the namespace from terminating.
              echo "------------------------------------------------------------------"
              echo "PostDelete: delete ibm-mas-${MAS_APP_ID} CSV in ${CR_NAMESPACE}"
              set +e
              CSV_NAME=$(oc get csv -n ${CR_NAMESPACE} \
                --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null \
                | grep "^ibm-mas-${MAS_APP_ID}\.")
              set -e
              if [[ -z "${CSV_NAME}" ]]; then
                echo "No ibm-mas-${MAS_APP_ID} CSV found - skipping"
              else
                echo "Deleting CSV: ${CSV_NAME}"
                oc delete csv "${CSV_NAME}" -n ${CR_NAMESPACE} \
                  --timeout=60s --wait=true 2>/dev/null || true
                echo "CSV deleted"
              fi

              # Clean up the postdelete RBAC objects in the app namespace.
              # These carry helm.sh/resource-policy: keep so ArgoCD did not prune them.
              # Delete Role
              echo "------------------------------------------------------------------"
              echo "PostDelete: clean up postdelete RBAC in ${CR_NAMESPACE}"

              # Delete Role
              echo "Deleting Role: ${APPNS_ROLE_NAME}"
              set +e
              oc delete role "${APPNS_ROLE_NAME}" \
                -n "${CR_NAMESPACE}" \
                --ignore-not-found \
                --timeout=60s \
                --wait=true
              ROLE_DELETE_RC=$?
              set -e

              if [[ ${ROLE_DELETE_RC} -eq 0 ]]; then
                echo "Role deletion completed"
              else
                echo "WARNING: Role deletion failed with exit code ${ROLE_DELETE_RC}"
              fi

              # Delete RoleBinding
              echo "Deleting RoleBinding: ${APPNS_RB_NAME}"
              set +e
              oc delete rolebinding "${APPNS_RB_NAME}" \
                -n "${CR_NAMESPACE}" \
                --ignore-not-found \
                --timeout=60s \
                --wait=true
              RB_DELETE_RC=$?
              set -e

              if [[ ${RB_DELETE_RC} -eq 0 ]]; then
                echo "RoleBinding deletion completed"
              else
                echo "WARNING: RoleBinding deletion failed with exit code ${RB_DELETE_RC}"
              fi

              echo "RBAC cleanup completed"
      volumes: []
  backoffLimit: 4
{{- end }}
{{- end }}
