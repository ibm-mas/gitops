{{- if .Values.application_admin_role }}
{{- if (or (eq $.Values.mas_app_id "manage") (eq $.Values.mas_app_id "health")) }}
{{- range $key, $value := $.Values.customization_archive_secret_names }}
---
kind: Secret
apiVersion: v1
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "600"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
{{- if $.Values.custom_labels }}
  labels:
{{ $.Values.custom_labels | toYaml | indent 4 }}
{{- end }}
  name: {{ $value.secret_name }}
  namespace: {{ $.Values.mas_app_namespace }}
stringData:
  {{- if or $value.access_secret_key $value.accessSecretKey $value.secret_key $value.access_key $value.accessKey }}
  {{- if $value.access_key }}
  accessKey: {{ $value.access_key }}
  {{- else if $value.accessKey }}
  accessKey: {{ $value.accessKey }}
  {{- end }}
  {{- if $value.access_secret_key }}
  accessSecretKey: {{ $value.access_secret_key }}
  secretKey: {{ $value.access_secret_key }}
  {{- else if $value.accessSecretKey }}
  accessSecretKey: {{ $value.accessSecretKey }}
  secretKey: {{ $value.accessSecretKey }}
  {{- else if $value.secret_key }}
  secretKey: {{ $value.secret_key }}
  accessSecretKey: {{ $value.secret_key }}
  {{- end }}
  {{- else }}
  credentials: |
    user={{ $value.username }}
    password={{ $value.password }}
  {{- end }}
type: Opaque
{{- end }}
{{- end }}

{{- end }}
