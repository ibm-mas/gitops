{{- if or (eq .Values.mas_app_id "manage") (eq .Values.mas_app_id "visualinspection") }}
{{- /*
This ConfigMap is not a hook (no argocd.argoproj.io/hook annotation). Its content
tracks the catalog version, so when it changes the Application goes OutOfSync, automated sync runs
and all of the PostSync test hooks for this app are executed again.
*/}}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: postsync-test-trigger-cm
  namespace: {{ .Values.mas_app_namespace }}
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
data:
  mas_catalog_version: "{{ .Values.mas_catalog_version | default "" }}"
{{- end }}
