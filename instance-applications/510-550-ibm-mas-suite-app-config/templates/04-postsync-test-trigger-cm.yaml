{{- if or (eq .Values.mas_app_id "manage") (eq .Values.mas_app_id "visualinspection") }}
{{- /*
The postsync-sanity-* and postsync-verify-* test Jobs are ArgoCD PostSync hooks. ArgoCD only runs
PostSync hooks when it performs a sync, and it does not take hook resources into account when
deciding whether an Application is OutOfSync.

mas_catalog_version is otherwise only used inside those hook resources, so a change to
catalog.version (tag or digest) in cluster-params.yaml would not cause a sync and the tests would
not re-run.

This ConfigMap is deliberately NOT a hook (no argocd.argoproj.io/hook annotation). Its content
tracks the catalog version, so when it changes the Application goes OutOfSync, automated sync runs
and all of the PostSync test hooks for this app are executed again.
*/}}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: postsync-test-trigger-cm
  namespace: {{ .Values.mas_app_namespace }}
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
data:
  mas_catalog_version: "{{ .Values.mas_catalog_version | default "" }}"
{{- end }}
