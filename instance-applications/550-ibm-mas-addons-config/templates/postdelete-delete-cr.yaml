{{- if and (.Values.use_postdelete_hooks) (.Values.application_admin_role) }}

{{- /*
Use the build/bin/set-cli-image-digest.sh script to update this value across all charts.
*/}}
{{- $_cli_image_digest := "sha256:e6c8f8a02b4bd44026dac280b1d006e60d55e15ee189fce18be7c6922879f8b6" }}

{{- /*
Meaningful prefix for the job resource name. Must be under 52 chars in length to leave room for the 11 chars reserved for '-' and $_job_hash.
*/}}
{{- $_job_name_prefix := "postdelete-delete-genericaddons" }}

{{- /*
A dict of values that influence the behaviour of the job in some way.
Any changes to values in this dict will trigger a new hook resource to be created.
*/}}
{{- $_job_config_values := omit .Values "junitreporter" }}

{{- /*
Increment this value whenever you make a change to an immutable field of the Job resource.
E.g. passing in a new environment variable.
*/}}
{{- $_job_version := "v1" }}

{{- $_job_hash := print ($_job_config_values | toYaml) $_cli_image_digest $_job_version | adler32sum }}
{{- $_job_name := join "-" (list $_job_name_prefix $_job_hash) }}

# NOTE: depends on resources created in ibm-mas-suite chart (01-postdelete-crs-resources)
# The values below must align with the values in that file
{{ $sa_name :=   "postdelete-delete-cr-sa" }}
{{ $job_label := "postdelete-delete-cr-job" }}
{{ $ns := printf "mas-%s-core" .Values.instance_id }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $_job_name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  template:
    metadata:
      labels:
        app: {{ $job_label }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
    spec:
      containers:
        - name: run
          image: {{ .Values.cli_image_repo | default "quay.io/ibmmas/cli" }}@{{ $_cli_image_digest }}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          env:
            - name: CR_NAMESPACE
              value: {{ $ns }}
          command:
            - /bin/sh
            - -c
            - |

              set -e
              echo
              echo "================================================================================"
              echo "PostDelete: deleting all GenericAddon CRs in namespace ${CR_NAMESPACE}"
              echo "================================================================================"
              echo
              echo "Note: this job fires only when the entire addons ArgoCD application is deleted"
              echo "(i.e. full instance deprovision). All GenericAddons in the namespace must be"
              echo "deleted so their operator-set finalizers are cleared before the Suite is torn down."
              echo

              # GenericAddons are optional — any subset (or none) may be present.
              set +e
              CR_NAMES=$(oc get genericaddons.addons.mas.ibm.com -n "${CR_NAMESPACE}" \
                -o=jsonpath="{.items[*].metadata.name}" 2>/dev/null)
              set -e

              if [[ -z "${CR_NAMES}" ]]; then
                echo "No GenericAddon CRs found in ${CR_NAMESPACE}, nothing to delete."
                exit 0
              fi

              echo "Found GenericAddon CRs: ${CR_NAMES}"

              for CR_NAME in ${CR_NAMES}; do
                echo
                echo "------------------------------------------------------------------"
                echo "Deleting GenericAddon ${CR_NAME} in namespace ${CR_NAMESPACE}"
                set +e
                oc delete genericaddons.addons.mas.ibm.com "${CR_NAME}" \
                  -n "${CR_NAMESPACE}" --timeout=300s --wait=true
                set -e

                echo "Verifying GenericAddon ${CR_NAME} is absent..."
                set +e
                STILL_PRESENT=$(oc get genericaddons.addons.mas.ibm.com "${CR_NAME}" \
                  -n "${CR_NAMESPACE}" -o=jsonpath="{.metadata.name}" 2>/dev/null)
                set -e

                if [[ -n "${STILL_PRESENT}" ]]; then
                  echo "GenericAddon ${CR_NAME} still present, failing job"
                  exit 1
                fi
                echo "... verified"
              done

              echo
              echo "All GenericAddon CRs deleted successfully."

      restartPolicy: Never
      serviceAccountName: {{ $sa_name }}

  backoffLimit: 4
{{- end }}
