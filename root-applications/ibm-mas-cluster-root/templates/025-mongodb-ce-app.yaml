{{- if and (not (empty .Values.mongodb_ce)) (eq (.Values.mongodb_ce.install | default "true") "true") (.Values.cluster_admin_role) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-ce.{{ .Values.cluster.id }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    environment: '{{ .Values.account.id }}'
    region: '{{ .Values.region.id }}'
    cluster: '{{ .Values.cluster.id }}'
    {{- if .Values.argo.instance }}
    argocd.argoproj.io/instance: '{{ .Values.argo.instance }}'
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "025"
    healthCheckTimeout: "1800"
    {{- if and .Values.notifications .Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-failed.workspace1: {{ .Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-succeeded.workspace1: {{ .Values.notifications.slack_channel_id }}
    {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "{{ .Values.argo.projects.apps }}"
  destination:
    server: {{ .Values.cluster.url }}
    namespace: {{ .Values.mongodb_ce.namespace | default "mongoce" }}
  source:
    repoURL: "{{ .Values.source.repo_url }}"
    path: cluster-applications/025-mongodb-ce
    targetRevision: "{{ .Values.source.revision }}"
    plugin:
      name: {{ .Values.avp.name }}
      env:
        - name: {{ .Values.avp.values_varname }}
          value: |
            account_id: "{{ .Values.account.id }}"
            region_id: "{{ .Values.region.id }}"
            cluster_id: "{{ .Values.cluster.id }}"
            cluster_admin_role: {{ .Values.cluster_admin_role }}
            run_sync_hooks: {{ .Values.mongodb_ce.run_sync_hooks | default true }}
            sm_aws_access_key_id: "{{ .Values.sm.aws_access_key_id }}"
            sm_aws_secret_access_key: "{{ .Values.sm.aws_secret_access_key }}"
            cli_image_repo: {{ .Values.cli_image_repo }}
            mongodb_operator_channel: "{{ .Values.mongodb_ce.channel | default "v0.7" }}"
            mongodb_operator_install_plan: "{{ .Values.mongodb_ce.install_plan | default "Automatic" }}"
            mongodb_operator_source: "{{ .Values.mongodb_ce.source | default "community-operators" }}"
            mongodb_operator_source_namespace: "{{ .Values.mongodb_ce.source_namespace | default "openshift-marketplace" }}"
            mongodb_namespace: "{{ .Values.mongodb_ce.namespace | default "mongoce" }}"
            mongodb_instance_name: "{{ .Values.mongodb_ce.instance_name | default "mas-mongo-ce" }}"
            mongodb_version: "{{ .Values.mongodb_ce.version | default "7.0.5" }}"
            mongodb_members: {{ .Values.mongodb_ce.members | default 3 }}
            admin_password: "{{ .Values.mongodb_ce.admin_password }}"
            storage_size: "{{ .Values.mongodb_ce.storage_size | default "10Gi" }}"
            storage_class: "{{ .Values.mongodb_ce.storage_class | default "" }}"
            {{- if .Values.custom_labels }}
            custom_labels: {{ .Values.custom_labels | toYaml | nindent 14 }}
            {{- end }}
        - name: ARGOCD_APP_NAME
          value: mongodbceapp
        {{- if not (empty .Values.avp.secret) }}
        - name: AVP_SECRET
          value: {{ .Values.avp.secret }}
        {{- end }}
  syncPolicy:
    automated:
      {{- if .Values.auto_delete }}
      prune: true
      {{- end }}
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=true
{{- if .Values.custom_labels }}
    managedNamespaceMetadata:
      labels:
{{ .Values.custom_labels | toYaml | indent 8 }}
{{- end }}
{{- end }}
