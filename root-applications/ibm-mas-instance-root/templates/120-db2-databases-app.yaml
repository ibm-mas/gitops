{{- /*
When inside the range loop below, make sure you prefix any references to chart values NOT under .Values.ibm_db2u_databases with $.
For example: {{ $.Values.account.id }} (instead of {{ .Values.account.id }} )
*/}}

{{- /* Helper variables to check if app channels are >= 9.2 (same logic as 510-550-ibm-mas-masapp-configs.yaml) */ -}}
{{- $iot_is_v92_or_higher := false -}}
{{- if and .Values.ibm_suite_app_iot_install .Values.ibm_suite_app_iot_install.mas_app_channel -}}
  {{- $iot_is_v92_or_higher = regexMatch "^9\\.(2|[3-9]|[1-9][0-9])\\..*" .Values.ibm_suite_app_iot_install.mas_app_channel -}}
{{- end -}}

{{- $monitor_is_v92_or_higher := false -}}
{{- if and .Values.ibm_suite_app_monitor_install .Values.ibm_suite_app_monitor_install.mas_app_channel -}}
  {{- $monitor_is_v92_or_higher = regexMatch "^9\\.(2|[3-9]|[1-9][0-9])\\..*" .Values.ibm_suite_app_monitor_install.mas_app_channel -}}
{{- end -}}

{{- range $i, $value := .Values.ibm_db2u_databases }}
{{- if $.Values.application_admin_role }}
{{- if not (contains "rds" $value.db2_instance_name) }}
{{- /*
Secondary (sdb) databases sync at the same wave as the config Application of the app they belong to, and a PreSync
hook in the db2u-database chart then waits for that one config Application to be Healthy. This means a slow app only
delays its own sdb; the sdb of every other app proceeds independently.
Manage and all other apps use 527 (the Manage config at 505 has already completed by then, so its gate passes immediately
and the Manage sdb does not hold up the other app installs at 525). IoT and Monitor follow their channel-based config waves.
If the app has no config Application, fall back to wave 550.
*/}}
{{- $_sdb_wave := "550" }}
{{- $_await_app_config_name := "" }}
{{- if contains "sdb" $value.db2_instance_name }}
{{-   range $c := $.Values.ibm_mas_masapp_configs }}
{{-     if and (eq $_await_app_config_name "") (eq $c.mas_app_id $value.mas_application_id) }}
{{-       $_await_app_config_name = printf "%s.%s.%s.%s" $c.mas_workspace_id $c.mas_app_id $.Values.cluster.id $.Values.instance.id }}
{{-       if eq $c.mas_app_id "iot" }}
{{-         $_sdb_wave = ternary "545" "527" $iot_is_v92_or_higher }}
{{-       else if eq $c.mas_app_id "monitor" }}
{{-         $_sdb_wave = ternary "527" "545" $monitor_is_v92_or_higher }}
{{-       else }}
{{-         $_sdb_wave = "527" }}
{{-       end }}
{{-     end }}
{{-   end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "db2-db.{{ $.Values.cluster.id }}.{{ $.Values.instance.id }}.{{ $value.db2_instance_name | replace (cat "db2wh-" $.Values.instance.id "-" | replace " " "") "" }}"
  namespace: {{ $.Values.argo.namespace }}
  labels:
    environment: '{{ $.Values.account.id }}'
    region: '{{ $.Values.region.id }}'
    cluster: '{{ $.Values.cluster.id }}'
    instance: '{{ $.Values.instance.id }}'
    appId: '{{ $value.mas_application_id }}'
  annotations:
{{ if not (contains "sdb" $value.db2_instance_name) }}
    argocd.argoproj.io/sync-wave: "120"
{{ else }}
    argocd.argoproj.io/sync-wave: "{{ $_sdb_wave }}"
{{ end }}
    {{- if and $.Values.notifications $.Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-failed.workspace1: {{ $.Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-succeeded.workspace1: {{ $.Values.notifications.slack_channel_id }}
    {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "{{ $.Values.argo.projects.apps }}"
  destination:
    server: {{ $.Values.cluster.url }}
    namespace: "{{ $.Values.ibm_db2u.db2_namespace }}"
  source:
    repoURL: "{{ $.Values.source.repo_url }}"
    path: instance-applications/120-ibm-db2u-database
    targetRevision: "{{ $.Values.source.revision }}"
    plugin:
      name: {{ $.Values.avp.name }} 
      env:
        - name: {{ $.Values.avp.values_varname }}
          value: |
            account_id: "{{ $.Values.account.id }}"
            region_id: "{{ $.Values.region.id }}"
            cluster_id: "{{ $.Values.cluster.id }}"
            instance_id: "{{ $.Values.instance.id }}"
            sm_aws_access_key_id: "{{ $.Values.sm.aws_access_key_id }}"
            sm_aws_secret_access_key: "{{ $.Values.sm.aws_secret_access_key }}"
            cluster_admin_role: {{ $.Values.cluster_admin_role }}
            application_admin_role: {{ $.Values.application_admin_role }}
            
            {{- if $.Values.custom_labels }}
            custom_labels: {{ $.Values.custom_labels | toYaml | nindent 14 }}
            {{- end }}
            
            {{- /*
            Check if there's a matching entry in ibm_mas_suite_configs where:
            - mas_application_id equals $value.mas_application_id
            - jdbc_type equals "incluster-db2"
            */}}
            {{- $_should_execute := false }}
            {{- if $.Values.ibm_mas_suite_configs }}
            {{-   range $index, $config := $.Values.ibm_mas_suite_configs }}
            {{-     if and (eq $config.mas_application_id $value.mas_application_id) (eq $config.jdbc_type "incluster-db2") }}
            {{-       $_should_execute = true }}
            {{-     end }}
            {{-   end }}
            {{- end }}
            should_execute: {{ $_should_execute }}
            argo_namespace: "{{ $.Values.argo.namespace }}"
            {{- if $_await_app_config_name }}
            await_app_config_name: "{{ $_await_app_config_name }}"
            {{- end }}
            junitreporter:
              reporter_name: db2-db-{{ $.Values.instance.id }}-{{ $value.db2_instance_name | replace (cat "db2wh-" $.Values.instance.id "-" | replace " " "") "" }}
              cluster_id: "{{ $.Values.cluster.id }}"
              instance_id: "{{ $.Values.instance.id }}"
              devops_mongo_uri: "{{ $.Values.devops.mongo_uri }}"
              devops_build_number: "{{ $.Values.devops.build_number }}"
              gitops_version: "{{ $.Values.source.revision }}"
              cli_image_repo: {{ $.Values.cli_image_repo }}
            {{ $value | toYaml | nindent 12 }}
        - name: ARGOCD_APP_NAME
          value: "db2dbapp-{{ $value.db2_instance_name | replace (cat "db2wh-" $.Values.instance.id "-" | replace " " "") "" }}"
        {{- if not (empty $.Values.avp.secret) }}
        - name: AVP_SECRET
          value: {{ $.Values.avp.secret }}
        {{- end }}
  syncPolicy:
    automated:
      prune: {{ $.Values.auto_delete }}
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: 'db2u.databases.ibm.com'
      kind: Db2uCluster
      jsonPointers:
      - /spec/environment/database/ssl/secretName
    - group: 'db2u.databases.ibm.com'
      kind: Db2uInstance
      jsonPointers:
      - /spec/environment/ssl/secretName
{{- end }}
{{- end }}
{{- end }}
