{{- if and (not (empty .Values.ibm_spss)) (not (empty .Values.ibm_cp4d)) (.Values.cluster_admin_role) }}
{{ $cpd_operators_ns := .Values.ibm_cp4d.cpd_operators_namespace }}
{{ $cpd_instance_ns := .Values.ibm_cp4d.cpd_instance_namespace }}
{{ $cpd_version := .Values.ibm_cp4d.cpd_product_version | default "0.0.0" | toString }}
{{ $is531 := not (lt (semver "5.3.1" | (semver $cpd_version).Compare) 0) }}
{{- if not $is531 }}
---
# CPD < 5.3.1 — OLM path
# IBM SPSS Modeler Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spss.{{ .Values.cluster.id }}.{{ .Values.instance.id }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    environment: '{{ .Values.account.id }}'
    region: '{{ .Values.region.id }}'
    cluster: '{{ .Values.cluster.id }}'
    {{- if .Values.argo.instance }}
    argocd.argoproj.io/instance: '{{ .Values.argo.instance }}'
    {{- end }}
    instance: '{{ .Values.instance.id }}'
  annotations:
    argocd.argoproj.io/sync-wave: "120"
    {{- if and .Values.notifications .Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-failed.workspace1: {{ .Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-succeeded.workspace1: {{ .Values.notifications.slack_channel_id }}
    {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "{{ .Values.argo.projects.apps }}"
  destination:
    server: {{ .Values.cluster.url }}
    namespace: {{ $cpd_operators_ns }}
  source:
    repoURL: "{{ .Values.source.repo_url }}"
    path: instance-applications/120-ibm-spss
    targetRevision: "{{ .Values.source.revision }}"
    plugin:
      name: {{ .Values.avp.name }}
      env:
        - name: {{ .Values.avp.values_varname }}
          value: |
            account_id: "{{ .Values.account.id }}"
            region_id: "{{ .Values.region.id }}"
            cluster_id: "{{ .Values.cluster.id }}"
            instance_id: "{{ .Values.instance.id }}"
            cli_image_repo: {{ .Values.cli_image_repo }}
            cluster_admin_role: {{ .Values.cluster_admin_role }}
            application_admin_role: {{ .Values.application_admin_role }}
            sm_aws_access_key_id: "{{ .Values.sm.aws_access_key_id }}"
            sm_aws_secret_access_key: "{{ .Values.sm.aws_secret_access_key }}"
            cpd_operators_namespace: "{{ .Values.ibm_cp4d.cpd_operators_namespace }}"
            cpd_instance_namespace: "{{ .Values.ibm_cp4d.cpd_instance_namespace }}"
            cpd_product_version: "{{ .Values.ibm_cp4d.cpd_product_version }}"
            cpd_service_storage_class: "{{ .Values.ibm_spss.cpd_service_storage_class }}"
            cpd_service_block_storage_class: "{{ .Values.ibm_spss.cpd_service_block_storage_class }}"
            cpd_service_scale_config: "{{ .Values.ibm_spss.cpd_service_scale_config }}"
            spss_version: "{{ .Values.ibm_spss.spss_version }}"
            spss_channel: "{{ .Values.ibm_spss.spss_channel }}"
            spss_install_plan: "{{ .Values.ibm_spss.spss_install_plan }}"
            ccs_version: "{{ .Values.ibm_spss.ccs_version }}"
            canvasbase_channel: "{{ .Values.ibm_spss.canvasbase_channel }}"
            canvasbase_install_plan: "{{ .Values.ibm_spss.canvasbase_install_plan }}"
            {{- if .Values.custom_labels }}
            custom_labels: {{ .Values.custom_labels | toYaml | nindent 14 }}
            {{- end }}
            junitreporter:
              reporter_name: "ibm-spss-{{ .Values.instance.id }}"
              cluster_id: "{{ .Values.cluster.id }}"
              instance_id: "{{ .Values.instance.id }}"
              devops_mongo_uri: "{{ .Values.devops.mongo_uri }}"
              devops_build_number: "{{ .Values.devops.build_number }}"
              gitops_version: "{{ .Values.source.revision }}"
              cli_image_repo: {{ .Values.cli_image_repo }}
        - name: ARGOCD_APP_NAME
          value: cpdspssapp
        {{- if not (empty .Values.avp.secret) }}
        - name: AVP_SECRET
          value: {{ .Values.avp.secret }}
        {{- end }}
  syncPolicy:
    automated:
      {{- if .Values.auto_delete }}
      prune: true
      {{- end }}
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=false
{{- else }}
{{- /*
  Read chart versions from olm-utils-cm (created by 110-ibm-cp4d).
  Falls back to known-good defaults if the ConfigMap is not yet present
  (e.g. during a helm template dry-run).
*/}}
{{- $olmUtils := lookup "v1" "ConfigMap" $cpd_instance_ns "olm-utils-cm" }}
{{- $meta := dict }}
{{- if $olmUtils }}
{{- $meta = $olmUtils.data.release_components_meta | fromYaml }}
{{- end }}
{{- $canvasbaseVersion := (index $meta "canvasbase" | default dict).case_version | default "12.1.0" }}
{{- $spssVersion       := (index $meta "spss"       | default dict).case_version | default "12.1.0" }}
---
# CPD >= 5.3.1 — native ArgoCD Helm Apps (no K8s Jobs)
# Wave 119: canvasbase cluster-scoped (CRDs + ClusterRoles)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spss-canvasbase-cluster.{{ .Values.cluster.id }}.{{ .Values.instance.id }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    environment: '{{ .Values.account.id }}'
    region: '{{ .Values.region.id }}'
    cluster: '{{ .Values.cluster.id }}'
    {{- if .Values.argo.instance }}
    argocd.argoproj.io/instance: '{{ .Values.argo.instance }}'
    {{- end }}
    instance: '{{ .Values.instance.id }}'
  annotations:
    argocd.argoproj.io/sync-wave: "119"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "{{ .Values.argo.projects.apps }}"
  destination:
    server: {{ .Values.cluster.url }}
    namespace: {{ $cpd_operators_ns }}
  source:
    chart: canvasbase-cluster-scoped
    repoURL: https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm
    targetRevision: "{{ $canvasbaseVersion }}"
    helm:
      valuesObject:
        global:
          licenseAccept: true
          releaseVersion: {{ $cpd_version }}
          operatorNamespace: {{ $cpd_operators_ns }}
          instanceNamespace: {{ $cpd_instance_ns }}
          imagePullSecret: ibm-entitlement-key
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
---
# Wave 120: canvasbase namespace-scoped (operator + CR)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spss-canvasbase.{{ .Values.cluster.id }}.{{ .Values.instance.id }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    environment: '{{ .Values.account.id }}'
    region: '{{ .Values.region.id }}'
    cluster: '{{ .Values.cluster.id }}'
    {{- if .Values.argo.instance }}
    argocd.argoproj.io/instance: '{{ .Values.argo.instance }}'
    {{- end }}
    instance: '{{ .Values.instance.id }}'
  annotations:
    argocd.argoproj.io/sync-wave: "120"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "{{ .Values.argo.projects.apps }}"
  destination:
    server: {{ .Values.cluster.url }}
    namespace: {{ $cpd_instance_ns }}
  source:
    chart: canvasbase
    repoURL: https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm
    targetRevision: "{{ $canvasbaseVersion }}"
    helm:
      valuesObject:
        global:
          licenseAccept: true
          releaseVersion: {{ $cpd_version }}
          operatorNamespace: {{ $cpd_operators_ns }}
          instanceNamespace: {{ $cpd_instance_ns }}
          fileStorageClass: {{ .Values.ibm_spss.cpd_service_storage_class }}
          blockStorageClass: {{ .Values.ibm_spss.cpd_service_block_storage_class }}
          imagePullSecret: ibm-entitlement-key
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=true
---
# Wave 121: SPSS cluster-scoped (CRDs + ClusterRoles)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spss-cluster.{{ .Values.cluster.id }}.{{ .Values.instance.id }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    environment: '{{ .Values.account.id }}'
    region: '{{ .Values.region.id }}'
    cluster: '{{ .Values.cluster.id }}'
    {{- if .Values.argo.instance }}
    argocd.argoproj.io/instance: '{{ .Values.argo.instance }}'
    {{- end }}
    instance: '{{ .Values.instance.id }}'
  annotations:
    argocd.argoproj.io/sync-wave: "121"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "{{ .Values.argo.projects.apps }}"
  destination:
    server: {{ .Values.cluster.url }}
    namespace: {{ $cpd_operators_ns }}
  source:
    chart: spss-cluster-scoped
    repoURL: https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm
    targetRevision: "{{ $spssVersion }}"
    helm:
      valuesObject:
        global:
          licenseAccept: true
          releaseVersion: {{ $cpd_version }}
          operatorNamespace: {{ $cpd_operators_ns }}
          instanceNamespace: {{ $cpd_instance_ns }}
          imagePullSecret: ibm-entitlement-key
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
---
# Wave 122: SPSS namespace-scoped (operator + CR)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spss.{{ .Values.cluster.id }}.{{ .Values.instance.id }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    environment: '{{ .Values.account.id }}'
    region: '{{ .Values.region.id }}'
    cluster: '{{ .Values.cluster.id }}'
    {{- if .Values.argo.instance }}
    argocd.argoproj.io/instance: '{{ .Values.argo.instance }}'
    {{- end }}
    instance: '{{ .Values.instance.id }}'
  annotations:
    argocd.argoproj.io/sync-wave: "122"
    {{- if and .Values.notifications .Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-failed.workspace1: {{ .Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-succeeded.workspace1: {{ .Values.notifications.slack_channel_id }}
    {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "{{ .Values.argo.projects.apps }}"
  destination:
    server: {{ .Values.cluster.url }}
    namespace: {{ $cpd_instance_ns }}
  source:
    chart: spss
    repoURL: https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm
    targetRevision: "{{ $spssVersion }}"
    helm:
      valuesObject:
        global:
          licenseAccept: true
          releaseVersion: {{ $cpd_version }}
          operatorNamespace: {{ $cpd_operators_ns }}
          instanceNamespace: {{ $cpd_instance_ns }}
          fileStorageClass: {{ .Values.ibm_spss.cpd_service_storage_class }}
          blockStorageClass: {{ .Values.ibm_spss.cpd_service_block_storage_class }}
          imagePullSecret: ibm-entitlement-key
        spss:
          scaleConfig: {{ .Values.ibm_spss.cpd_service_scale_config }}
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
