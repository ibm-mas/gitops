{{- if and (not (empty .Values.ibm_wml)) (not (empty .Values.ibm_cp4d)) (.Values.cluster_admin_role) }}
{{ $cpd_operators_ns := .Values.ibm_cp4d.cpd_operators_namespace }}
{{ $cpd_instance_ns := .Values.ibm_cp4d.cpd_instance_namespace }}
{{ $cpd_version := .Values.ibm_cp4d.cpd_product_version | default "0.0.0" | toString }}
{{ $is531 := not (lt (semver "5.3.1" | (semver $cpd_version).Compare) 0) }}
{{- if not $is531 }}
---
# CPD < 5.3.1 — OLM path
# IBM WML Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wml.{{ .Values.cluster.id }}.{{ .Values.instance.id }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    environment: '{{ .Values.account.id }}'
    region: '{{ .Values.region.id }}'
    cluster: '{{ .Values.cluster.id }}'
    {{- if .Values.argo.instance }}
    argocd.argoproj.io/instance: '{{ .Values.argo.instance }}'
    {{- end }}
    instance: '{{ .Values.instance.id }}'
  annotations:
    argocd.argoproj.io/sync-wave: "120"
    {{- if and .Values.notifications .Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-failed.workspace1: {{ .Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-succeeded.workspace1: {{ .Values.notifications.slack_channel_id }}
    {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  ignoreDifferences:
  - group: '*'
    kind: ServiceAccount
    jsonPointers:
    - /imagePullSecrets
  project: "{{ .Values.argo.projects.apps }}"
  destination:
    server: {{ .Values.cluster.url }}
    namespace: {{ $cpd_operators_ns }}
  source:
    repoURL: "{{ .Values.source.repo_url }}"
    path: instance-applications/120-ibm-wml
    targetRevision: "{{ .Values.source.revision }}"
    plugin:
      name: {{ .Values.avp.name }}
      env:
        - name: {{ .Values.avp.values_varname }}
          value: |
            cluster_admin_role: {{ .Values.cluster_admin_role }}
            application_admin_role: {{ .Values.application_admin_role }}
            cpd_operators_namespace: "{{ .Values.ibm_cp4d.cpd_operators_namespace }}"
            cpd_instance_namespace: "{{ .Values.ibm_cp4d.cpd_instance_namespace }}"
            cpd_product_version: "{{ .Values.ibm_cp4d.cpd_product_version }}"
            ccs_version: "{{ .Values.ibm_wml.ccs_version }}"
            cpd_service_block_storage_class: "{{ .Values.ibm_wml.cpd_service_block_storage_class }}"
            cpd_service_scale_config: "{{ .Values.ibm_wml.cpd_service_scale_config }}"
            cpd_service_storage_class: "{{ .Values.ibm_wml.cpd_service_storage_class }}"
            wml_channel: "{{ .Values.ibm_wml.wml_channel }}"
            wml_version: "{{ .Values.ibm_wml.wml_version }}"
            wml_install_plan: "{{ .Values.ibm_wml.wml_install_plan }}"
            {{- if .Values.custom_labels }}
            custom_labels: {{ .Values.custom_labels | toYaml | nindent 14 }}
            {{- end }}
            junitreporter:
              reporter_name: "ibm-wml-{{ .Values.instance.id }}"
              cluster_id: "{{ .Values.cluster.id }}"
              instance_id: "{{ .Values.instance.id }}"
              devops_mongo_uri: "{{ .Values.devops.mongo_uri }}"
              devops_build_number: "{{ .Values.devops.build_number }}"
              gitops_version: "{{ .Values.source.revision }}"
              cli_image_repo: {{ .Values.cli_image_repo }}
        - name: ARGOCD_APP_NAME
          value: cpdwmlapp
        {{- if not (empty .Values.avp.secret) }}
        - name: AVP_SECRET
          value: {{ .Values.avp.secret }}
        {{- end }}
  syncPolicy:
    automated:
      {{- if .Values.auto_delete }}
      prune: true
      {{- end }}
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
{{- else }}
{{- /*
  Chart version resolution (highest priority first):
    1. Explicit gitops config value (e.g. ibm_wml.wml_chart_version)
    2. olm-utils-cm ConfigMap lookup (deployed by wave 110-ibm-cp4d)
    3. Hardcoded default (safety net for helm template dry-runs)
*/}}
{{- $olmUtils := lookup "v1" "ConfigMap" $cpd_instance_ns "olm-utils-cm" }}
{{- $meta := dict }}
{{- if $olmUtils }}
{{- $meta = $olmUtils.data.release_components_meta | fromYaml }}
{{- end }}
{{- $redisVersion := .Values.ibm_wml.redis_chart_version | default ((index $meta "ibm_redis_cp" | default dict).case_version | default "1.3.1") }}
{{- $wmlVersion   := .Values.ibm_wml.wml_chart_version   | default ((index $meta "wml"          | default dict).case_version | default "12.1.0") }}
---
# CPD >= 5.3.1 — native ArgoCD Helm Apps (no K8s Jobs)
# Wave 119: ibm-redis-cp cluster-scoped (CRDs + ClusterRoles)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wml-redis-cluster.{{ .Values.cluster.id }}.{{ .Values.instance.id }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    environment: '{{ .Values.account.id }}'
    region: '{{ .Values.region.id }}'
    cluster: '{{ .Values.cluster.id }}'
    {{- if .Values.argo.instance }}
    argocd.argoproj.io/instance: '{{ .Values.argo.instance }}'
    {{- end }}
    instance: '{{ .Values.instance.id }}'
  annotations:
    argocd.argoproj.io/sync-wave: "119"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "{{ .Values.argo.projects.apps }}"
  destination:
    server: {{ .Values.cluster.url }}
    namespace: {{ $cpd_operators_ns }}
  source:
    chart: ibm-redis-cp-cluster-scoped
    repoURL: https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm
    targetRevision: "{{ $redisVersion }}"
    helm:
      valuesObject:
        global:
          licenseAccept: true
          operatorNamespace: {{ $cpd_operators_ns }}
          instanceNamespace: {{ $cpd_instance_ns }}
          imagePullSecret: ibm-entitlement-key
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
---
# Wave 120: ibm-redis-cp namespace-scoped (operator)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wml-redis.{{ .Values.cluster.id }}.{{ .Values.instance.id }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    environment: '{{ .Values.account.id }}'
    region: '{{ .Values.region.id }}'
    cluster: '{{ .Values.cluster.id }}'
    {{- if .Values.argo.instance }}
    argocd.argoproj.io/instance: '{{ .Values.argo.instance }}'
    {{- end }}
    instance: '{{ .Values.instance.id }}'
  annotations:
    argocd.argoproj.io/sync-wave: "120"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "{{ .Values.argo.projects.apps }}"
  destination:
    server: {{ .Values.cluster.url }}
    namespace: {{ $cpd_operators_ns }}
  source:
    chart: ibm-redis-cp
    repoURL: https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm
    targetRevision: "{{ $redisVersion }}"
    helm:
      valuesObject:
        global:
          licenseAccept: true
          operatorNamespace: {{ $cpd_operators_ns }}
          instanceNamespace: {{ $cpd_instance_ns }}
          imagePullSecret: ibm-entitlement-key
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=false
---
# Wave 121: WML cluster-scoped (CRDs + ClusterRoles)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wml-cluster.{{ .Values.cluster.id }}.{{ .Values.instance.id }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    environment: '{{ .Values.account.id }}'
    region: '{{ .Values.region.id }}'
    cluster: '{{ .Values.cluster.id }}'
    {{- if .Values.argo.instance }}
    argocd.argoproj.io/instance: '{{ .Values.argo.instance }}'
    {{- end }}
    instance: '{{ .Values.instance.id }}'
  annotations:
    argocd.argoproj.io/sync-wave: "121"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "{{ .Values.argo.projects.apps }}"
  destination:
    server: {{ .Values.cluster.url }}
    namespace: {{ $cpd_operators_ns }}
  source:
    chart: wml-cluster-scoped
    repoURL: https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm
    targetRevision: "{{ $wmlVersion }}"
    helm:
      valuesObject:
        global:
          licenseAccept: true
          releaseVersion: {{ $cpd_version }}
          operatorNamespace: {{ $cpd_operators_ns }}
          instanceNamespace: {{ $cpd_instance_ns }}
          imagePullSecret: ibm-entitlement-key
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
---
# Wave 122: WML namespace-scoped (operator + CR)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wml.{{ .Values.cluster.id }}.{{ .Values.instance.id }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    environment: '{{ .Values.account.id }}'
    region: '{{ .Values.region.id }}'
    cluster: '{{ .Values.cluster.id }}'
    {{- if .Values.argo.instance }}
    argocd.argoproj.io/instance: '{{ .Values.argo.instance }}'
    {{- end }}
    instance: '{{ .Values.instance.id }}'
  annotations:
    argocd.argoproj.io/sync-wave: "122"
    {{- if and .Values.notifications .Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-failed.workspace1: {{ .Values.notifications.slack_channel_id }}
    notifications.argoproj.io/subscribe.on-sync-succeeded.workspace1: {{ .Values.notifications.slack_channel_id }}
    {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "{{ .Values.argo.projects.apps }}"
  destination:
    server: {{ .Values.cluster.url }}
    namespace: {{ $cpd_instance_ns }}
  source:
    chart: wml
    repoURL: https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm
    targetRevision: "{{ $wmlVersion }}"
    helm:
      valuesObject:
        global:
          licenseAccept: true
          releaseVersion: {{ $cpd_version }}
          operatorNamespace: {{ $cpd_operators_ns }}
          instanceNamespace: {{ $cpd_instance_ns }}
          fileStorageClass: {{ .Values.ibm_wml.cpd_service_storage_class }}
          blockStorageClass: {{ .Values.ibm_wml.cpd_service_block_storage_class }}
          imagePullSecret: ibm-entitlement-key
        wml:
          scaleConfig: {{ .Values.ibm_wml.cpd_service_scale_config }}
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
