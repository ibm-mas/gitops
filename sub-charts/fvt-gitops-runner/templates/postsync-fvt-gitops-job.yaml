{{- if .Values.enabled }}

{{- /*
Meaningful prefix for the job resource name. Must be under 52 chars to leave room for the 11 chars reserved for '-' and $_job_hash.
*/}}
{{- $_job_name_prefix := "fvt-gitops" }}

{{- /*
A dict of values that influence the behaviour of the job.
Any changes to values in this dict will trigger a rerun of the job.
*/}}
{{- $_job_config_values := omit .Values "junitreporter" }}

{{- /*
Increment this value whenever you make a change to an immutable field of the Job resource.
*/}}
{{- $_job_version := "v1" }}

{{- /*
10-char hash appended to the job name ensuring ArgoCD creates a new Job instead of
attempting (and failing) to update an immutable field of any existing Job resource.
*/}}
{{- $_job_hash := print ($_job_config_values | toYaml) $_job_version | adler32sum }}

{{- $_job_name := join "-" (list $_job_name_prefix $_job_hash) }}

{{- /*
Set as the value for the mas.ibm.com/job-cleanup-group label on the Job resource.
A CronJob in the cluster uses this label to prune old Job resources.
*/}}
{{- $_job_cleanup_group := cat $_job_name_prefix | sha1sum }}

{{- $prefix      := $_job_name_prefix }}
{{- $secret      := printf "%s-devopsuri" $prefix }}
{{- $sa          := printf "%s-sa" $prefix }}
{{- $role        := printf "%s-role" $prefix }}
{{- $rb          := printf "%s-rb" $prefix }}
{{- $roleCore    := printf "%s-role-core" $prefix }}
{{- $rbCore      := printf "%s-rb-core" $prefix }}
{{- $roleArgo    := printf "%s-role-argo" $prefix }}
{{- $rbArgo      := printf "%s-rb-argo" $prefix }}
{{- $clusterRole := printf "%s-clusterrole" $prefix }}
{{- $clusterRb   := printf "%s-clusterrb-%s" $prefix .Values.instance_id }}
{{- $np          := printf "%s-np" $prefix }}
{{- $coreNs      := printf "mas-%s-core" .Values.instance_id }}
{{- $manageNs    := printf "mas-%s-manage" .Values.instance_id }}
{{- $argoNs      := .Values.argo_namespace }}
{{- $roleManage  := printf "%s-role-manage" $prefix }}
{{- $rbManage    := printf "%s-rb-manage" $prefix }}
{{- $roleConsole := printf "%s-role-console" $prefix }}
{{- $rbConsole   := printf "%s-rb-console" $prefix }}

---
# NetworkPolicy — allow egress from the test Job (MongoDB + cluster API)
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ $np }}
  annotations:
    argocd.argoproj.io/sync-wave: "1001"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  podSelector:
    matchLabels:
      app: {{ $_job_name_prefix }}-job
  egress:
    - {}
  policyTypes:
    - Egress

---
# Secret — MongoDB URI
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $secret }}
  annotations:
    argocd.argoproj.io/sync-wave: "1001"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
stringData:
  devops_mongo_uri: "{{ .Values.devops_mongo_uri }}"

---
# ServiceAccount
kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ $sa }}
  annotations:
    argocd.argoproj.io/sync-wave: "1001"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
imagePullSecrets:
  - name: ibm-entitlement

---
# Role — read-only access to cluster resources needed by the tests
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $role }}
  annotations:
    argocd.argoproj.io/sync-wave: "1001"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  # Read MAS CRs
  - apiGroups: ["core.mas.ibm.com", "apps.mas.ibm.com"]
    resources: ["suites", "manageapps", "manageworkspaces"]
    verbs: ["get", "list"]
  # Read pods, secrets, configmaps
  - apiGroups: [""]
    resources: ["pods", "secrets", "configmaps"]
    verbs: ["get", "list"]
  # Read DRO CRs
  - apiGroups: ["datarouter.ibm.com"]
    resources: ["datareporterconfigs"]
    verbs: ["get", "list"]

---
# RoleBinding (postsyncjobs namespace)
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $rb }}
  annotations:
    argocd.argoproj.io/sync-wave: "1002"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: "mas-{{ .Values.instance_id }}-postsyncjobs"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $role }}

---
# Role — read MAS CRs in the core namespace
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $roleCore }}
  namespace: {{ $coreNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "1001"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - apiGroups: ["core.mas.ibm.com", "apps.mas.ibm.com"]
    resources: ["suites", "manageapps", "manageworkspaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "secrets", "configmaps", "routes"]
    verbs: ["get", "list"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]

---
# RoleBinding — bind SA to core-namespace role
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $rbCore }}
  namespace: {{ $coreNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "1002"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: "mas-{{ .Values.instance_id }}-postsyncjobs"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleCore }}

{{- if contains "manage" .Values.enabled_apps }}
---
# Role — read manageworkspaces in the manage namespace
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $roleManage }}
  namespace: {{ $manageNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "1001"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - apiGroups: ["apps.mas.ibm.com"]
    resources: ["manageapps", "manageworkspaces"]
    verbs: ["get", "list"]

---
# RoleBinding — bind SA to manage-namespace role
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $rbManage }}
  namespace: {{ $manageNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "1002"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: "mas-{{ .Values.instance_id }}-postsyncjobs"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleManage }}
{{- end }}

---
# Role — read routes in openshift-console namespace
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $roleConsole }}
  namespace: openshift-console
  annotations:
    argocd.argoproj.io/sync-wave: "1001"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]

---
# RoleBinding — bind SA to openshift-console role
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $rbConsole }}
  namespace: openshift-console
  annotations:
    argocd.argoproj.io/sync-wave: "1002"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: "mas-{{ .Values.instance_id }}-postsyncjobs"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleConsole }}

---
# Role — read ArgoCD Applications in argo namespace
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $roleArgo }}
  namespace: {{ $argoNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "1001"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]

---
# RoleBinding — bind SA to argo-namespace role
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $rbArgo }}
  namespace: {{ $argoNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "1002"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: "mas-{{ .Values.instance_id }}-postsyncjobs"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleArgo }}

---
# ClusterRole — read cluster-scoped resources needed by the tests
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $clusterRole }}
  annotations:
    argocd.argoproj.io/sync-wave: "1001"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
rules:
  # OCP cluster version (used by save-xml.py to record OCP version in results)
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions"]
    verbs: ["get", "list"]
  # Namespaces (used by test_core_namespace_exists / test_core_namespace_active)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  # CatalogSources are cluster-scoped in some OCP versions
  - apiGroups: ["operators.coreos.com"]
    resources: ["catalogsources"]
    verbs: ["get", "list"]

---
# ClusterRoleBinding — bind SA to cluster-scoped role
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $clusterRb }}
  annotations:
    argocd.argoproj.io/sync-wave: "1002"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
{{- if .Values.custom_labels }}
  labels:
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: "mas-{{ .Values.instance_id }}-postsyncjobs"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterRole }}

---
# Job — runs fvt-gitops PostSync
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $_job_name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1005"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    mas.ibm.com/job-cleanup-group: {{ $_job_cleanup_group }}
{{- if .Values.custom_labels }}
{{ .Values.custom_labels | toYaml | indent 4 }}
{{- end }}
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: {{ $_job_name_prefix }}-job
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $sa }}

      containers:
        - name: fvt-gitops
          image: {{ .Values.fvt_gitops_image_repo }}:{{ .Values.fvt_gitops_image_tag }}
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          env:
            - name: ENABLED_APPS
              value: "{{ .Values.enabled_apps }}"
            - name: INSTANCE_ID
              value: "{{ .Values.instance_id }}"
            - name: NAMESPACE
              value: "mas-{{ .Values.instance_id }}-core"
            - name: WORKSPACE_ID
              value: "{{ .Values.workspace_id }}"
            - name: PRODUCT_ID
              value: "ibm-mas-gitops"
            - name: PRODUCT_CHANNEL
              value: "{{ .Values.product_channel }}"
            - name: CONTAINER_VERSION
              value: "{{ .Values.fvt_gitops_image_tag }}"
            - name: ARGOCD_APP_NAME
              value: "suite.{{ .Values.cluster_id }}.{{ .Values.instance_id }}"
            - name: GITOPS_VERSION
              value: "{{ .Values.gitops_version }}"
            - name: BUILD_NUM
              value: "{{ .Values.devops_build_number }}"
            - name: DEVOPS_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: devops_mongo_uri
                  optional: true
          command:
            - /bin/bash
            - -c
            - |
              exec /bin/bash /opt/ibm/test/src/run_suites.sh

{{- end }}
