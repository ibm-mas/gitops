# ---------------------------------------------------------------------------
# fvt-gitops-runner default values
# Override these in the parent chart's values.yaml or via ArgoCD.
# ---------------------------------------------------------------------------

# Set to enable the test runner Job
enabled: true

# MongoDB connection string.  Leave empty to skip result recording.
devops_mongo_uri: ""

# Build / run identifier written to MongoDB
devops_build_number: ""

# MAS instance ID
instance_id: ""

# Cluster ID (used to construct ArgoCD app name e.g. suite.<cluster_id>.<instance_id>)
cluster_id: ""

# MAS workspace ID
workspace_id: "masdev"

# Comma-separated list of test suites to run, derived from the enabled MAS
# apps in the instance.  "suite" is always included; app names that have a
# matching suite directory in the image (e.g. "manage") are appended.
# Example:  "suite,manage"   or   "suite,manage,facilities"
enabled_apps: "suite"

# GitOps chart version (written to MongoDB for traceability)
gitops_version: ""

# Product channel label written to MongoDB (required by ubi-fvt register-start.py / save-xml.py)
product_channel: "gitops"

# fvt-gitops container image
fvt_gitops_image_repo: "docker-na-public.artifactory.swg-devops.com/wiotp-docker-local/mas-devops/fvt-gitops"
fvt_gitops_image_tag:  "latest"

# ArgoCD namespace
argo_namespace: "openshift-gitops"

# Optional custom labels applied to all resources
custom_labels: {}
